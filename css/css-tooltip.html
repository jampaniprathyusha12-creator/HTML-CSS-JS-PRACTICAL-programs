<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Tooltip</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f7fb;
            text-align: center;
        }

        header {
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            color: white;
            padding: 45px 20px;
        }

        main {
            width: 90%;
            max-width: 800px;
            margin: 50px auto;
        }

        section {
            background-color: white;
            padding: 50px 30px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        h2 {
            color: #2563eb;
        }

        /* Tooltip container */

        .tooltip {
            position: relative;
            display: inline-block;
            margin-top: 30px;
        }

        .tooltip-button {
            background-color: #2563eb;
            color: white;
            padding: 15px 25px;
            border-radius: 8px;
            cursor: pointer;
        }

        /* Tooltip text */

        .tooltip-text {
            visibility: hidden;
            width: 220px;
            background-color: #0f172a;
            color: white;
            text-align: center;
            padding: 10px;
            border-radius: 6px;

            position: absolute;
            bottom: 130%;
            left: 50%;
            transform: translateX(-50%);

            opacity: 0;
            transition: opacity 0.3s;
        }

        /* Show tooltip */

        .tooltip:hover .tooltip-text {
            visibility: visible;
            opacity: 1;
        }

        footer {
            background-color: #0f172a;
            color: white;
            padding: 25px;
            margin-top: 60px;
        }
    </style>

</head>

<body>


    <header>

        <h1>
            CSS Tooltip
        </h1>

        <p>
            Hover over the button to see the tooltip
        </p>

    </header>


    <main>

        <section>

            <h2>
                Tooltip Example
            </h2>

            <div class="tooltip">

                <div class="tooltip-button">
                    Hover Me
                </div>

                <div class="tooltip-text">
                    This is a CSS tooltip!
                </div>

            </div>

        </section>

    </main>


    <footer>

        <p>
            HTML and CSS Practical Programs
        </p>

        <p>
            CSS Program 41
        </p>

    </footer>
    <a href="index.html">← Back to CSS Programs</a>
    <br><br>
    <a href="../index.html">← Home</a>


</body>

</html>

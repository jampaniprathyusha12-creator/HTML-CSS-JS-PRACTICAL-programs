<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Gradients</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f7fb;
            color: #1f2937;
        }

        header {
            background: linear-gradient(135deg,
                    #2563eb,
                    #7c3aed);

            color: white;
            text-align: center;
            padding: 45px 20px;
        }

        main {
            width: 90%;
            max-width: 1000px;
            margin: 40px auto;
        }

        section {
            background-color: white;
            padding: 30px;
            margin-bottom: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        h2 {
            color: #2563eb;
        }

        .linear {
            height: 200px;

            background: linear-gradient(to right,
                    #2563eb,
                    #7c3aed);

            border-radius: 15px;

            display: flex;
            justify-content: center;
            align-items: center;

            color: white;
            font-size: 24px;
            font-weight: bold;
        }

        .radial {
            height: 200px;

            background: radial-gradient(circle,
                    #60a5fa,
                    #2563eb,
                    #1e3a8a);

            border-radius: 15px;

            display: flex;
            justify-content: center;
            align-items: center;

            color: white;
            font-size: 24px;
            font-weight: bold;
        }

        footer {
            background-color: #0f172a;
            color: white;
            text-align: center;
            padding: 25px;
            margin-top: 50px;
        }
    </style>

</head>

<body>

    <header>

        <h1>CSS Gradients</h1>

        <p>
            Linear Gradient and Radial Gradient
        </p>

    </header>


    <main>

        <section>

            <h2>Linear Gradient</h2>

            <div class="linear">
                Linear Gradient
            </div>

        </section>


        <section>

            <h2>Radial Gradient</h2>

            <div class="radial">
                Radial Gradient
            </div>

        </section>

    </main>


    <footer>

        <p>
            HTML and CSS Practical Programs
        </p>

        <p>
            CSS Program 31
        </p>

    </footer>
    <a href="index.html">← Back to CSS Programs</a>
    <br><br>
    <a href="../index.html">← Home</a>

</body>

</html>

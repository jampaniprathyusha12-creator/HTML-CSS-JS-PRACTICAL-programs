<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login Page</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #dbeafe, #ede9fe);
            color: #1f2937;
        }

        header {
            background: linear-gradient(135deg, #0f172a, #2563eb);
            color: white;
            text-align: center;
            padding: 40px 20px;
        }

        header h1 {
            margin-bottom: 10px;
        }

        main {
            min-height: 500px;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .login-box {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.12);
        }

        .login-box h2 {
            text-align: center;
            color: #2563eb;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background-color: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background-color: #1e40af;
        }

        .forgot {
            text-align: center;
            margin-top: 18px;
        }

        .forgot a {
            color: #2563eb;
            text-decoration: none;
        }

        footer {
            background-color: #0f172a;
            color: white;
            text-align: center;
            padding: 25px;
        }

        @media (max-width: 500px) {

            .login-box {
                padding: 25px 20px;
            }

            header h1 {
                font-size: 28px;
            }

        }
    </style>

</head>

<body>

    <header>

        <h1>
            Login Page
        </h1>

        <p>
            HTML and CSS Login Form
        </p>

    </header>


    <main>

        <section class="login-box">

            <h2>
                User Login
            </h2>

            <form>

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input type="email" id="email" placeholder="Enter your email" required>

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input type="password" id="password" placeholder="Enter your password" required>

                </div>


                <button type="submit">
                    Login
                </button>

            </form>


            <div class="forgot">

                <a href="#">
                    Forgot Password?
                </a>

            </div>

        </section>

    </main>


    <footer>

        <p>
            HTML, CSS & JavaScript Practical Programs
        </p>

        <p>
            CSS Program 22
        </p>

    </footer>
    <a href="index.html">← Back to CSS Programs</a>
    <br><br>
    <a href="../index.html">← Home</a>

</body>

</html>

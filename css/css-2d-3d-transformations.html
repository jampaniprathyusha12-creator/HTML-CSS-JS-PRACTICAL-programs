<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>2D and 3D Transformations</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f7fb;
            text-align: center;
        }

        h1 {
            color: #2563eb;
            margin: 35px;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            margin: auto;

            display: flex;
            justify-content: center;
            gap: 50px;
            flex-wrap: wrap;
        }

        .section {
            background-color: white;
            padding: 30px;
            border-radius: 12px;

            box-shadow:
                0 5px 15px rgba(0, 0, 0, 0.1);

            width: 400px;
        }

        .section h2 {
            color: #2563eb;
        }

        /* 2D Transformation */

        .box-2d {
            width: 150px;
            height: 150px;

            margin: 40px auto;

            background-color: #2563eb;
            color: white;

            display: flex;
            justify-content: center;
            align-items: center;

            border-radius: 10px;

            transition: transform 1s;
        }

        .box-2d:hover {
            transform:
                translate(20px, 20px) rotate(20deg) scale(1.2);
        }

        /* 3D Transformation */

        .scene {
            perspective: 600px;
        }

        .box-3d {
            width: 150px;
            height: 150px;

            margin: 40px auto;

            background-color: #7c3aed;
            color: white;

            display: flex;
            justify-content: center;
            align-items: center;

            border-radius: 10px;

            transition: transform 1s;
        }

        .box-3d:hover {
            transform:
                rotateX(45deg) rotateY(45deg) rotateZ(20deg);
        }

        p {
            line-height: 1.6;
        }

        @media (max-width: 600px) {

            .section {
                width: 100%;
            }

        }
    </style>
</head>

<body>

    <h1>
        2D and 3D CSS Transformations
    </h1>


    <div class="container">


        <!-- 2D -->

        <div class="section">

            <h2>2D Transformation</h2>

            <div class="box-2d">
                Hover Me
            </div>

            <p>
                Uses translate(), rotate() and scale()
                to transform the element in two dimensions.
            </p>

        </div>


        <!-- 3D -->

        <div class="section">

            <h2>3D Transformation</h2>

            <div class="scene">

                <div class="box-3d">
                    Hover Me
                </div>

            </div>

            <p>
                Uses rotateX(), rotateY() and rotateZ()
                to create a three-dimensional transformation.
            </p>

        </div>


    </div>
    <a href="index.html">← Back to CSS Programs</a>
    <br><br>
    <a href="../index.html">← Home</a>

</body>

</html>

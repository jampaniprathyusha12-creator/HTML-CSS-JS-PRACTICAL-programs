<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Button Hover Animation</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f7fb;
            text-align: center;
        }

        header {
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            color: white;
            padding: 45px 20px;
        }

        main {
            width: 90%;
            max-width: 800px;
            margin: 50px auto;
        }

        section {
            background-color: white;
            padding: 60px 30px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        h2 {
            color: #2563eb;
        }

        /* CSS-only button */

        .animated-button {
            display: inline-block;
            margin-top: 30px;
            padding: 15px 35px;

            background-color: #2563eb;
            color: white;

            border: none;
            border-radius: 30px;

            font-size: 18px;
            cursor: pointer;

            transition: all 0.4s ease;
        }

        /* Hover animation */

        .animated-button:hover {
            transform: translateY(-8px) scale(1.05);
            background-color: #7c3aed;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.25);
        }

        footer {
            background-color: #0f172a;
            color: white;
            padding: 25px;
            margin-top: 60px;
        }
    </style>

</head>

<body>


    <header>

        <h1>
            CSS Button Hover Animation
        </h1>

        <p>
            A button animation created using only CSS
        </p>

    </header>


    <main>

        <section>

            <h2>
                Hover Over the Button
            </h2>

            <p>
                Move your mouse over the button to see
                the CSS hover animation.
            </p>

            <button class="animated-button">
                Hover Me
            </button>

        </section>

    </main>


    <footer>

        <p>
            HTML and CSS Practical Programs
        </p>

        <p>
            CSS Program 42
        </p>

    </footer>
    <a href="index.html">← Back to CSS Programs</a>
    <br><br>
    <a href="../index.html">← Home</a>


</body>

</html>

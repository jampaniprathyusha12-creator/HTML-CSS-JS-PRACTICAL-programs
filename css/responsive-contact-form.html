<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Responsive Contact Form</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f7fb;
            color: #1f2937;
        }

        header {
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            color: white;
            text-align: center;
            padding: 45px 20px;
        }

        .container {
            width: 90%;
            max-width: 800px;
            margin: 40px auto;
        }

        .contact-form {
            background-color: white;
            padding: 35px;
            border-radius: 15px;

            box-shadow:
                0 5px 15px rgba(0, 0, 0, 0.1);
        }

        h2 {
            color: #2563eb;
            text-align: center;
        }

        .row {
            display: flex;
            gap: 20px;
        }

        .field {
            flex: 1;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 12px;

            border: 1px solid #cbd5e1;
            border-radius: 7px;

            font-family: Arial, sans-serif;
            font-size: 15px;
        }

        textarea {
            height: 150px;
            resize: vertical;
        }

        input:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: #2563eb;
        }

        button {
            width: 100%;
            padding: 14px;

            background-color: #2563eb;
            color: white;

            border: none;
            border-radius: 7px;

            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #7c3aed;
        }

        footer {
            background-color: #0f172a;
            color: white;
            text-align: center;
            padding: 25px;
            margin-top: 50px;
        }

        /* Responsive */

        @media (max-width: 600px) {

            .row {
                flex-direction: column;
                gap: 0;
            }

            .contact-form {
                padding: 25px;
            }

        }
    </style>

</head>

<body>


    <header>

        <h1>
            Contact Us
        </h1>

        <p>
            We would love to hear from you
        </p>

    </header>


    <main class="container">

        <div class="contact-form">

            <h2>
                Send Us a Message
            </h2>


            <form>


                <div class="row">

                    <div class="field">

                        <label for="name">
                            Full Name
                        </label>

                        <input type="text" id="name" placeholder="Enter your name" required>

                    </div>


                    <div class="field">

                        <label for="email">
                            Email
                        </label>

                        <input type="email" id="email" placeholder="Enter your email" required>

                    </div>

                </div>


                <div class="field">

                    <label for="subject">
                        Subject
                    </label>

                    <input type="text" id="subject" placeholder="Enter subject" required>

                </div>


                <div class="field">

                    <label for="category">
                        Category
                    </label>

                    <select id="category">

                        <option>
                            General Enquiry
                        </option>

                        <option>
                            Technical Support
                        </option>

                        <option>
                            Feedback
                        </option>

                    </select>

                </div>


                <div class="field">

                    <label for="message">
                        Message
                    </label>

                    <textarea id="message" placeholder="Write your message here..." required></textarea>

                </div>


                <button type="submit">
                    Send Message
                </button>


            </form>

        </div>

    </main>


    <footer>

        <p>
            HTML and CSS Practical Programs
        </p>

        <p>
            CSS Program 54
        </p>

    </footer>
    <a href="index.html">← Back to CSS Programs</a>
    <br><br>
    <a href="../index.html">← Home</a>


</body>

</html>

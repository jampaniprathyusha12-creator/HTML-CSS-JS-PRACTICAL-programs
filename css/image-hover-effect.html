<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Image Hover Effect</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f7fb;
            text-align: center;
        }

        header {
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            color: white;
            padding: 45px 20px;
        }

        main {
            width: 90%;
            max-width: 800px;
            margin: 40px auto;
        }

        section {
            background-color: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        h2 {
            color: #2563eb;
        }

        .image-container {
            width: 400px;
            max-width: 100%;
            margin: 30px auto;
            overflow: hidden;
            border-radius: 15px;
        }

        .image-container img {
            width: 100%;
            display: block;
            transition: 0.5s ease;
        }

        /* Hover effect */

        .image-container:hover img {
            transform: scale(1.15);
            opacity: 0.8;
        }

        footer {
            background-color: #0f172a;
            color: white;
            padding: 25px;
            margin-top: 50px;
        }
    </style>

</head>

<body>


    <header>

        <h1>
            Image Hover Effect
        </h1>

        <p>
            Move the mouse over the image
        </p>

    </header>


    <main>

        <section>

            <h2>
                CSS Image Hover Effect
            </h2>

            <div class="image-container">

                <img src="../assets/images/brightsun.jpg" alt="Nature">

            </div>

            <p>
                The image becomes larger and slightly
                transparent when you hover over it.
            </p>

        </section>

    </main>


    <footer>

        <p>
            HTML and CSS Practical Programs
        </p>

        <p>
            CSS Program 40
        </p>

    </footer>
    <a href="index.html">← Back to CSS Programs</a>
    <br><br>
    <a href="../index.html">← Home</a>


</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login and Signup</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #2563eb, #7c3aed);

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px;
        }

        .container {
            width: 100%;
            max-width: 900px;

            display: flex;
            background-color: white;

            border-radius: 15px;
            overflow: hidden;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.2);
        }

        /* Left side */

        .welcome {
            flex: 1;
            background-color: #1d4ed8;
            color: white;

            padding: 50px 35px;

            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .welcome h1 {
            margin-top: 0;
        }

        .welcome p {
            line-height: 1.7;
        }

        /* Forms */

        .forms {
            flex: 1;
            padding: 40px;
        }

        .forms h2 {
            color: #2563eb;
            text-align: center;
        }

        form {
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;

            border: 1px solid #cbd5e1;
            border-radius: 7px;

            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
        }

        button {
            width: 100%;
            padding: 13px;

            margin-top: 20px;

            background-color: #2563eb;
            color: white;

            border: none;
            border-radius: 7px;

            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #7c3aed;
        }

        .divider {
            text-align: center;
            margin: 25px 0;
            color: #64748b;
        }

        /* Mobile */

        @media (max-width: 700px) {

            body {
                padding: 15px;
            }

            .container {
                flex-direction: column;
            }

            .welcome {
                padding: 30px;
                text-align: center;
            }

            .forms {
                padding: 30px;
            }

        }
    </style>

</head>

<body>


    <div class="container">


        <div class="welcome">

            <h1>
                Welcome!
            </h1>

            <p>
                Create an account or login to continue.
                This responsive webpage is created using
                HTML and CSS.
            </p>

        </div>


        <div class="forms">


            <!-- Login -->

            <h2>
                Login
            </h2>

            <form>

                <label for="login-email">
                    Email
                </label>

                <input type="email" id="login-email" placeholder="Enter your email" required>


                <label for="login-password">
                    Password
                </label>

                <input type="password" id="login-password" placeholder="Enter your password" required>


                <button type="submit">
                    Login
                </button>

            </form>


            <div class="divider">
                OR
            </div>


            <!-- Signup -->

            <h2>
                Sign Up
            </h2>

            <form>

                <label for="name">
                    Full Name
                </label>

                <input type="text" id="name" placeholder="Enter your name" required>


                <label for="signup-email">
                    Email
                </label>

                <input type="email" id="signup-email" placeholder="Enter your email" required>


                <label for="signup-password">
                    Password
                </label>

                <input type="password" id="signup-password" placeholder="Create a password" required>


                <button type="submit">
                    Sign Up
                </button>

            </form>


        </div>


    </div>
    <a href="index.html">← Back to CSS Programs</a>
    <br><br>
    <a href="../index.html">← Home</a>


</body>

</html>

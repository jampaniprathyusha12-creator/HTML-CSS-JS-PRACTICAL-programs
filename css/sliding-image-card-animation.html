<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sliding Card Animation</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f7fb;
            text-align: center;
        }

        h1 {
            color: #2563eb;
            margin: 35px;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            margin: auto;

            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
        }

        .card {
            width: 280px;
            background-color: white;

            border-radius: 12px;
            overflow: hidden;

            box-shadow:
                0 5px 15px rgba(0, 0, 0, 0.1);

            animation: slideIn 2s ease;
        }

        .card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }

        .content {
            padding: 20px;
        }

        .content h2 {
            color: #2563eb;
        }

        .content p {
            line-height: 1.6;
        }

        /* Sliding animation */

        @keyframes slideIn {

            from {
                transform: translateX(-100px);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }

        }

        .card:nth-child(2) {
            animation-delay: 0.5s;
        }

        .card:nth-child(3) {
            animation-delay: 1s;
        }

        @media (max-width: 600px) {

            .card {
                width: 100%;
                max-width: 350px;
            }

        }
    </style>
</head>

<body>

    <h1>Sliding Card Animation</h1>

    <div class="container">


        <div class="card">

            <img src="../assets/icons/business.jpg" alt="Business">

            <div class="content">

                <h2>business</h2>

                <p>
                    Explore beautiful places and
                    discover new experiences.
                </p>

            </div>

        </div>


        <div class="card">

            <img src="../assets/icons/technology.jpg" alt="Technology">

            <div class="content">

                <h2>Technology</h2>

                <p>
                    Discover modern technology and
                    innovative ideas.
                </p>

            </div>

        </div>


        <div class="card">

            <img src="../assets/icons/chicken biryani.jpg" alt="Chicken Biryani">

            <div class="content">

                <h2>chicken biryani</h2>

                <p>
                    Enjoy delicious food and
                    memorable dining experiences.
                </p>

            </div>

        </div>


    </div>
    <a href="index.html">← Back to CSS Programs</a>
    <br><br>
    <a href="../index.html">← Home</a>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Grid Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f7fb;
            color: #1f2937;
        }

        .dashboard {
            min-height: 100vh;

            display: grid;

            grid-template-columns: 220px 1fr;

            grid-template-rows: 70px 1fr;
        }

        /* Header */

        .header {
            grid-column: 1 / -1;

            background-color: #2563eb;
            color: white;

            display: flex;
            align-items: center;

            padding: 0 25px;
        }

        .header h1 {
            margin: 0;
        }

        /* Sidebar */

        .sidebar {
            background-color: #0f172a;
            color: white;
            padding: 25px;
        }

        .sidebar h2 {
            margin-top: 0;
        }

        .sidebar a {
            display: block;
            color: white;
            text-decoration: none;
            padding: 12px 5px;
            margin: 5px 0;
            border-radius: 5px;
        }

        .sidebar a:hover {
            background-color: #2563eb;
        }

        /* Main content */

        .main {
            padding: 30px;
        }

        .cards {
            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 20px;
        }

        .card {
            background-color: white;
            padding: 25px;
            border-radius: 12px;

            box-shadow:
                0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .card h3 {
            margin-top: 0;
            color: #2563eb;
        }

        .number {
            font-size: 30px;
            font-weight: bold;
        }

        .chart {
            margin-top: 25px;
            background-color: white;
            padding: 30px;
            border-radius: 12px;

            min-height: 200px;
        }

        .bars {
            display: flex;
            align-items: end;
            justify-content: center;
            gap: 25px;
            height: 120px;
        }

        .bar {
            width: 40px;
            background-color: #2563eb;
        }

        .bar1 {
            height: 50px;
        }

        .bar2 {
            height: 80px;
        }

        .bar3 {
            height: 110px;
        }

        .bar4 {
            height: 70px;
        }

        /* Responsive */

        @media (max-width: 900px) {

            .cards {
                grid-template-columns: repeat(2, 1fr);
            }

        }

        @media (max-width: 600px) {

            .dashboard {
                grid-template-columns: 1fr;
                grid-template-rows: auto auto 1fr;
            }

            .header {
                grid-column: 1;
            }

            .sidebar {
                display: flex;
                gap: 10px;
                flex-wrap: wrap;
            }

            .sidebar h2 {
                width: 100%;
            }

            .cards {
                grid-template-columns: 1fr;
            }

            .main {
                padding: 20px;
            }

        }
    </style>

</head>

<body>


    <div class="dashboard">


        <header class="header">

            <h1>
                Dashboard
            </h1>

        </header>


        <aside class="sidebar">

            <h2>
                Menu
            </h2>

            <a href="#">Dashboard</a>

            <a href="#">Students</a>

            <a href="#">Courses</a>

            <a href="#">Reports</a>

            <a href="#">Settings</a>

        </aside>


        <main class="main">

            <h2>
                Overview
            </h2>


            <div class="cards">


                <div class="card">

                    <h3>
                        Students
                    </h3>

                    <div class="number">
                        250
                    </div>

                </div>


                <div class="card">

                    <h3>
                        Courses
                    </h3>

                    <div class="number">
                        15
                    </div>

                </div>


                <div class="card">

                    <h3>
                        Projects
                    </h3>

                    <div class="number">
                        48
                    </div>

                </div>


                <div class="card">

                    <h3>
                        Tasks
                    </h3>

                    <div class="number">
                        32
                    </div>

                </div>


            </div>


            <div class="chart">

                <h3>
                    Performance Chart
                </h3>

                <div class="bars">

                    <div class="bar bar1"></div>

                    <div class="bar bar2"></div>

                    <div class="bar bar3"></div>

                    <div class="bar bar4"></div>

                </div>

            </div>


        </main>


    </div>
    <a href="index.html">← Back to CSS Programs</a>
    <br><br>
    <a href="../index.html">← Home</a>


</body>

</html>

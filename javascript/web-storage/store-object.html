<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store Object in localStorage</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            text-align: center;
            padding: 40px;
        }

        .container {
            max-width: 550px;
            margin: auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
        }

        button {
            padding: 12px 20px;
            margin: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        #output {
            margin-top: 20px;
            padding: 20px;
            background-color: #eeeeee;
            text-align: left;
            line-height: 1.8;
        }

        a {
            text-decoration: none;
            color: blue;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Store JavaScript Object</h1>

        <button onclick="storeObject()">Store Object</button>

        <button onclick="displayObject()">Display Object</button>

        <div id="output"></div>

        <br>

        <a href="../index.html">← Back to JavaScript Programs</a>
        <br><br>
        <a href="../../index.html">← Home</a>

    </div>

    <script>

        function storeObject() {

            let student = {
                name: "Prathyusha",
                course: "B.Tech",
                department: "Computer Science",
                year: 2
            };

            localStorage.setItem(
                "student",
                JSON.stringify(student)
            );

            document.getElementById("output").innerHTML =
                "Student object stored successfully!";
        }

        function displayObject() {

            let storedData = localStorage.getItem("student");

            if (storedData === null) {
                document.getElementById("output").innerHTML =
                    "No student object found.";
                return;
            }

            let student = JSON.parse(storedData);

            document.getElementById("output").innerHTML =
                "<strong>Name:</strong> " + student.name + "<br>" +
                "<strong>Course:</strong> " + student.course + "<br>" +
                "<strong>Department:</strong> " + student.department + "<br>" +
                "<strong>Year:</strong> " + student.year;
        }

    </script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update localStorage Data</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            text-align: center;
            padding: 50px;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
        }

        input {
            padding: 10px;
            width: 80%;
            font-size: 16px;
        }

        button {
            padding: 10px 20px;
            margin-top: 15px;
            font-size: 16px;
            cursor: pointer;
        }

        #output {
            margin-top: 20px;
            padding: 15px;
            background-color: #eeeeee;
        }

        a {
            text-decoration: none;
            color: blue;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Update localStorage Data</h1>

        <input type="text" id="username" placeholder="Enter new username">

        <br>

        <button onclick="updateUsername()">Update Username</button>

        <div id="output"></div>

        <br>

        <a href="../index.html">← Back to JavaScript Programs</a>
        <br><br>
        <a href="../../index.html">← Home</a>

    </div>

    <script>

        function updateUsername() {

            let newUsername = document.getElementById("username").value;

            if (newUsername.trim() === "") {
                document.getElementById("output").innerHTML =
                    "Please enter a new username.";
                return;
            }

            if (localStorage.getItem("username") === null) {
                document.getElementById("output").innerHTML =
                    "No existing username found. Please store one first.";
                return;
            }

            localStorage.setItem("username", newUsername);

            document.getElementById("output").innerHTML =
                "Username updated successfully!<br>" +
                "New Username: <strong>" + newUsername + "</strong>";
        }

    </script>

</body>

</html>

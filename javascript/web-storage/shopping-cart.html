<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart Using localStorage</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            padding: 40px;
        }

        .container {
            max-width: 650px;
            margin: auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
        }

        h1 {
            text-align: center;
        }

        select,
        input {
            padding: 10px;
            font-size: 16px;
            margin: 8px;
        }

        button {
            padding: 10px 18px;
            font-size: 15px;
            cursor: pointer;
        }

        .item {
            background-color: #eeeeee;
            padding: 12px;
            margin-top: 10px;
        }

        a {
            text-decoration: none;
            color: blue;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Shopping Cart</h1>

        <select id="product">
            <option value="Laptop|50000">Laptop - ₹50,000</option>
            <option value="Headphones|2000">Headphones - ₹2,000</option>
            <option value="Keyboard|1500">Keyboard - ₹1,500</option>
            <option value="Mouse|800">Mouse - ₹800</option>
        </select>

        <input type="number" id="quantity" value="1" min="1">

        <button onclick="addToCart()">Add to Cart</button>

        <h2>Cart Items</h2>

        <div id="cart"></div>

        <h3 id="total"></h3>

        <br>

        <a href="../index.html">← Back to JavaScript Programs</a>
        <br><br>
        <a href="../../index.html">← Home</a>

    </div>

    <script>

        let cart = JSON.parse(localStorage.getItem("cart")) || [];

        function saveCart() {
            localStorage.setItem("cart", JSON.stringify(cart));
        }

        function addToCart() {

            let productData =
                document.getElementById("product").value.split("|");

            let name = productData[0];
            let price = Number(productData[1]);
            let quantity =
                Number(document.getElementById("quantity").value);

            if (quantity < 1) {
                alert("Quantity must be at least 1.");
                return;
            }

            cart.push({
                name: name,
                price: price,
                quantity: quantity
            });

            saveCart();
            displayCart();
        }

        function displayCart() {

            let cartDiv = document.getElementById("cart");

            cartDiv.innerHTML = "";

            let total = 0;

            if (cart.length === 0) {
                cartDiv.innerHTML = "Your cart is empty.";
                document.getElementById("total").innerHTML = "";
                return;
            }

            cart.forEach(function (item, index) {

                let itemTotal = item.price * item.quantity;

                total += itemTotal;

                cartDiv.innerHTML +=
                    "<div class='item'>" +
                    "<strong>" + item.name + "</strong><br>" +
                    "Price: ₹" + item.price + "<br>" +
                    "Quantity: " + item.quantity + "<br>" +
                    "Subtotal: ₹" + itemTotal +
                    "<br><button onclick='removeItem(" + index + ")'>" +
                    "Remove</button>" +
                    "</div>";
            });

            document.getElementById("total").innerHTML =
                "Total Amount: ₹" + total;
        }

        function removeItem(index) {

            cart.splice(index, 1);

            saveCart();
            displayCart();
        }

        // Display saved cart items when the page loads
        displayCart();

    </script>

</body>

</html>

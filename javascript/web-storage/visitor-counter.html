<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visitor Counter</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            text-align: center;
            padding: 50px;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
        }

        #count {
            font-size: 40px;
            font-weight: bold;
            margin: 20px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }

        a {
            text-decoration: none;
            color: blue;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Visitor Counter</h1>

        <p>This page has been visited:</p>

        <div id="count">0</div>

        <p>times on this browser.</p>

        <button onclick="resetCounter()">
            Reset Counter
        </button>

        <br><br>

        <a href="../index.html">← Back to JavaScript Programs</a>
        <br><br>
        <a href="../../index.html">← Home</a>

    </div>

    <script>

        let visits = localStorage.getItem("visitorCount");

        if (visits === null) {
            visits = 1;
        } else {
            visits = Number(visits) + 1;
        }

        localStorage.setItem("visitorCount", visits);

        document.getElementById("count").innerHTML = visits;

        function resetCounter() {

            localStorage.removeItem("visitorCount");

            document.getElementById("count").innerHTML = 0;
        }

    </script>

</body>

</html>

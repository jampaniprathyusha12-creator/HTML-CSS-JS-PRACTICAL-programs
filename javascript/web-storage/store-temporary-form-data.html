<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temporary Form Data</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            text-align: center;
            padding: 40px;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
        }

        input,
        textarea {
            width: 90%;
            padding: 10px;
            margin: 8px 0;
            font-size: 16px;
            box-sizing: border-box;
        }

        textarea {
            height: 100px;
        }

        button {
            padding: 10px 18px;
            margin: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        #output {
            margin-top: 20px;
            padding: 15px;
            background-color: #eeeeee;
        }

        a {
            text-decoration: none;
            color: blue;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Temporary Form Data</h1>

        <form id="form">

            <input type="text" id="name" placeholder="Enter your name">

            <input type="email" id="email" placeholder="Enter your email">

            <textarea id="message" placeholder="Enter your message"></textarea>

            <br>

            <button type="button" onclick="saveData()">
                Save Temporarily
            </button>

            <button type="button" onclick="clearData()">
                Clear Data
            </button>

        </form>

        <div id="output">
            Temporary data will be saved in sessionStorage.
        </div>

        <br>

        <a href="../index.html">← Back to JavaScript Programs</a>
        <br><br>
        <a href="../../index.html">← Home</a>

    </div>

    <script>

        window.onload = function () {

            document.getElementById("name").value =
                sessionStorage.getItem("tempName") || "";

            document.getElementById("email").value =
                sessionStorage.getItem("tempEmail") || "";

            document.getElementById("message").value =
                sessionStorage.getItem("tempMessage") || "";
        };

        function saveData() {

            let name =
                document.getElementById("name").value;

            let email =
                document.getElementById("email").value;

            let message =
                document.getElementById("message").value;

            sessionStorage.setItem("tempName", name);
            sessionStorage.setItem("tempEmail", email);
            sessionStorage.setItem("tempMessage", message);

            document.getElementById("output").innerHTML =
                "Form data saved temporarily using sessionStorage.";
        }

        function clearData() {

            sessionStorage.removeItem("tempName");
            sessionStorage.removeItem("tempEmail");
            sessionStorage.removeItem("tempMessage");

            document.getElementById("name").value = "";
            document.getElementById("email").value = "";
            document.getElementById("message").value = "";

            document.getElementById("output").innerHTML =
                "Temporary form data cleared.";
        }

    </script>

</body>

</html>

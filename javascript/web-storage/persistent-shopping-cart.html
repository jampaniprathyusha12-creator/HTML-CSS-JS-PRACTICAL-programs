<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Persistent Shopping Cart</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            text-align: center;
            padding: 30px;
        }

        .container {
            max-width: 650px;
            margin: auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
        }

        select,
        input {
            padding: 10px;
            margin: 8px;
            font-size: 16px;
        }

        button {
            padding: 10px 18px;
            margin: 8px;
            cursor: pointer;
        }

        #cart {
            margin-top: 25px;
            text-align: left;
        }

        .cart-item {
            padding: 10px;
            margin: 8px 0;
            background-color: #eeeeee;
            border-radius: 5px;
        }

        a {
            text-decoration: none;
            color: blue;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Persistent Shopping Cart</h1>

        <select id="product">
            <option value="Laptop" data-price="50000">
                Laptop - ₹50,000
            </option>

            <option value="Headphones" data-price="2000">
                Headphones - ₹2,000
            </option>

            <option value="Keyboard" data-price="1500">
                Keyboard - ₹1,500
            </option>

            <option value="Mouse" data-price="800">
                Mouse - ₹800
            </option>
        </select>

        <input type="number" id="quantity" min="1" value="1">

        <br>

        <button onclick="addToCart()">
            Add to Cart
        </button>

        <div id="cart"></div>

        <button onclick="clearCart()">
            Clear Cart
        </button>

        <br><br>

        <a href="../index.html">← Back to JavaScript Programs</a>
        <br><br>
        <a href="../../index.html">← Home</a>

    </div>

    <script>

        let cart =
            JSON.parse(localStorage.getItem("persistentCart")) || [];

        function addToCart() {

            let product =
                document.getElementById("product");

            let productName = product.value;

            let price =
                Number(
                    product.options[product.selectedIndex]
                        .getAttribute("data-price")
                );

            let quantity =
                Number(
                    document.getElementById("quantity").value
                );

            if (quantity < 1) {
                quantity = 1;
            }

            let existingItem = cart.find(function (item) {
                return item.name === productName;
            });

            if (existingItem) {
                existingItem.quantity += quantity;
            } else {
                cart.push({
                    name: productName,
                    price: price,
                    quantity: quantity
                });
            }

            saveCart();
            displayCart();
        }

        function saveCart() {

            localStorage.setItem(
                "persistentCart",
                JSON.stringify(cart)
            );
        }

        function displayCart() {

            let output = "<h2>Your Cart</h2>";
            let total = 0;

            if (cart.length === 0) {
                output += "<p>Your cart is empty.</p>";
            } else {

                cart.forEach(function (item, index) {

                    let itemTotal =
                        item.price * item.quantity;

                    total += itemTotal;

                    output += `
                        <div class="cart-item">
                            <strong>${item.name}</strong><br>
                            Price: ₹${item.price}<br>
                            Quantity: ${item.quantity}<br>
                            Subtotal: ₹${itemTotal}
                            <br>
                            <button onclick="removeItem(${index})">
                                Remove
                            </button>
                        </div>
                    `;
                });

                output += "<h3>Total: ₹" + total + "</h3>";
            }

            document.getElementById("cart").innerHTML =
                output;
        }

        function removeItem(index) {

            cart.splice(index, 1);

            saveCart();
            displayCart();
        }

        function clearCart() {

            cart = [];

            localStorage.removeItem("persistentCart");

            displayCart();
        }

        window.onload = function () {
            displayCart();
        };

    </script>

</body>

</html>

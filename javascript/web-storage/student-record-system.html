<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Record System</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            padding: 30px;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
        }

        h1 {
            text-align: center;
        }

        input {
            width: 95%;
            padding: 10px;
            margin: 8px 0;
            font-size: 16px;
        }

        button {
            padding: 10px 18px;
            margin: 8px 5px 8px 0;
            font-size: 15px;
            cursor: pointer;
        }

        .record {
            background-color: #eeeeee;
            padding: 15px;
            margin-top: 10px;
            border-radius: 6px;
        }

        a {
            text-decoration: none;
            color: blue;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Student Record System</h1>

        <input type="text" id="name" placeholder="Enter student name">

        <input type="text" id="rollNo" placeholder="Enter roll number">

        <input type="text" id="course" placeholder="Enter course">

        <button onclick="addStudent()">Add Student</button>

        <button onclick="displayStudents()">Display Records</button>

        <div id="output"></div>

        <br>

        <a href="../index.html">← Back to JavaScript Programs</a>
        <br><br>
        <a href="../../index.html">← Home</a>

    </div>

    <script>

        function addStudent() {

            let name = document.getElementById("name").value.trim();
            let rollNo = document.getElementById("rollNo").value.trim();
            let course = document.getElementById("course").value.trim();

            if (name === "" || rollNo === "" || course === "") {
                document.getElementById("output").innerHTML =
                    "Please fill in all fields.";
                return;
            }

            let students = JSON.parse(
                localStorage.getItem("students")
            ) || [];

            let student = {
                name: name,
                rollNo: rollNo,
                course: course
            };

            students.push(student);

            localStorage.setItem(
                "students",
                JSON.stringify(students)
            );

            document.getElementById("name").value = "";
            document.getElementById("rollNo").value = "";
            document.getElementById("course").value = "";

            document.getElementById("output").innerHTML =
                "Student record added successfully!";
        }

        function displayStudents() {

            let students = JSON.parse(
                localStorage.getItem("students")
            ) || [];

            let output = document.getElementById("output");

            if (students.length === 0) {
                output.innerHTML = "No student records found.";
                return;
            }

            output.innerHTML = "<h3>Student Records</h3>";

            students.forEach(function (student, index) {

                output.innerHTML +=
                    "<div class='record'>" +
                    "<strong>Student " + (index + 1) + "</strong><br>" +
                    "Name: " + student.name + "<br>" +
                    "Roll Number: " + student.rollNo + "<br>" +
                    "Course: " + student.course +
                    "</div>";
            });
        }

    </script>

</body>

</html>

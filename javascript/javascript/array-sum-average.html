<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sum and Average of Array</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 60px;
        }

        h1 {
            color: #333;
        }

        #output {
            font-size: 22px;
            font-weight: bold;
            line-height: 2;
            margin: 30px;
        }

        a {
            display: inline-block;
            margin: 10px;
            padding: 10px 15px;
            text-decoration: none;
            background-color: #333;
            color: white;
            border-radius: 5px;
        }
    </style>
</head>

<body>

    <h1>JavaScript Program 14</h1>

    <div id="output"></div>

    <a href="../index.html">← Back to JavaScript Programs</a>
    <a href="../../index.html">← Home</a>

    <script>
        let numbers = [10, 20, 30, 40, 50];
        let sum = 0;

        for (let i = 0; i < numbers.length; i++) {
            sum = sum + numbers[i];
        }

        let average = sum / numbers.length;

        document.getElementById("output").innerHTML =
            "Array: " + numbers.join(", ") + "<br><br>" +
            "Sum: " + sum + "<br>" +
            "Average: " + average;
    </script>

</body>

</html>

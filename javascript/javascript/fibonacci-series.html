<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fibonacci Series</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 60px;
        }

        h1 {
            color: #333;
        }

        #output {
            font-size: 22px;
            font-weight: bold;
            margin: 30px;
        }

        a {
            display: inline-block;
            margin: 10px;
            padding: 10px 15px;
            text-decoration: none;
            background-color: #333;
            color: white;
            border-radius: 5px;
        }
    </style>
</head>

<body>

    <h1>JavaScript Program 7</h1>

    <div id="output"></div>

    <a href="../index.html">← Back to JavaScript Programs</a>
    <a href="../../index.html">← Home</a>

    <script>
        let n = 10;
        let first = 0;
        let second = 1;
        let series = "";

        for (let i = 1; i <= n; i++) {
            series += first + " ";

            let next = first + second;
            first = second;
            second = next;
        }

        document.getElementById("output").innerHTML =
            "First " + n + " Fibonacci Numbers:<br><br>" + series;
    </script>

</body>

</html>

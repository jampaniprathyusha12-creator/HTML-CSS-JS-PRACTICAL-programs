<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JavaScript Objects</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 60px;
        }

        h1 {
            color: #333;
        }

        #output {
            font-size: 20px;
            line-height: 2;
            margin: 30px;
        }

        a {
            display: inline-block;
            margin: 10px;
            padding: 10px 15px;
            text-decoration: none;
            background-color: #333;
            color: white;
            border-radius: 5px;
        }
    </style>
</head>

<body>

    <h1>JavaScript Program 19</h1>

    <div id="output"></div>

    <a href="../index.html">← Back to JavaScript Programs</a>
    <a href="../../index.html">← Home</a>

    <script>
        let student = {
            name: "Prathyusha",
            age: 19,
            course: "B.Tech",
            university: "Sai University"
        };

        document.getElementById("output").innerHTML =
            "Student Name: " + student.name + "<br>" +
            "Age: " + student.age + "<br>" +
            "Course: " + student.course + "<br>" +
            "University: " + student.university;
    </script>

</body>

</html>

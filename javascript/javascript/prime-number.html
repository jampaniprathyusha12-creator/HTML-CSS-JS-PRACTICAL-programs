<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Prime Number - JavaScript</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 60px;
        }

        h1 {
            color: #333;
        }

        #output {
            font-size: 24px;
            font-weight: bold;
            margin: 30px;
        }

        a {
            display: inline-block;
            margin: 10px;
            padding: 10px 15px;
            text-decoration: none;
            background-color: #333;
            color: white;
            border-radius: 5px;
        }
    </style>
</head>

<body>

    <h1>JavaScript Program 8</h1>

    <div id="output"></div>

    <a href="../index.html">← Back to JavaScript Programs</a>
    <a href="../../index.html">← Home</a>

    <script>
        let number = 17;
        let isPrime = true;

        if (number <= 1) {
            isPrime = false;
        } else {
            for (let i = 2; i < number; i++) {
                if (number % i === 0) {
                    isPrime = false;
                    break;
                }
            }
        }

        if (isPrime) {
            document.getElementById("output").innerHTML =
                number + " is a Prime Number";
        } else {
            document.getElementById("output").innerHTML =
                number + " is not a Prime Number";
        }
    </script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Arithmetic Operations - JavaScript</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 60px;
        }

        h1 {
            color: #333;
        }

        #output {
            font-size: 20px;
            line-height: 2;
            margin: 30px;
        }

        a {
            display: inline-block;
            margin: 10px;
            padding: 10px 15px;
            text-decoration: none;
            background-color: #333;
            color: white;
            border-radius: 5px;
        }
    </style>
</head>

<body>

    <h1>JavaScript Program 2</h1>

    <div id="output"></div>

    <a href="../index.html">← Back to JavaScript Programs</a>
    <a href="../../index.html">← Home</a>

    <script>
        let num1 = 20;
        let num2 = 10;

        let addition = num1 + num2;
        let subtraction = num1 - num2;
        let multiplication = num1 * num2;
        let division = num1 / num2;
        let modulus = num1 % num2;

        document.getElementById("output").innerHTML =
            "First Number: " + num1 + "<br>" +
            "Second Number: " + num2 + "<br><br>" +
            "Addition: " + addition + "<br>" +
            "Subtraction: " + subtraction + "<br>" +
            "Multiplication: " + multiplication + "<br>" +
            "Division: " + division + "<br>" +
            "Modulus: " + modulus;
    </script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sum of Digits - JavaScript</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 60px;
        }

        h1 {
            color: #333;
        }

        #output {
            font-size: 24px;
            font-weight: bold;
            margin: 30px;
        }

        a {
            display: inline-block;
            margin: 10px;
            padding: 10px 15px;
            text-decoration: none;
            background-color: #333;
            color: white;
            border-radius: 5px;
        }
    </style>
</head>

<body>

    <h1>JavaScript Program 11</h1>

    <div id="output"></div>

    <a href="../index.html">← Back to JavaScript Programs</a>
    <a href="../../index.html">← Home</a>

    <script>
        let number = 12345;
        let originalNumber = number;
        let sum = 0;

        while (number > 0) {
            let digit = number % 10;
            sum = sum + digit;
            number = Math.floor(number / 10);
        }

        document.getElementById("output").innerHTML =
            "Number: " + originalNumber + "<br><br>" +
            "Sum of Digits: " + sum;
    </script>

</body>

</html>

<!DOCTYPE html>
<html>

<head>
    <title>Change Multiple HTML Elements</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }

        .box {
            padding: 15px;
            margin: 10px;
            border: 1px solid black;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h2 id="heading">Original Heading</h2>

    <p class="box">Original Paragraph 1</p>
    <p class="box">Original Paragraph 2</p>
    <p class="box">Original Paragraph 3</p>

    <button onclick="changeElements()">Change All</button>

    <br><br>
    <a href="../index.html">← Back to JavaScript Programs</a>
    <br><br>
    <a href="../../index.html">← Home</a>

    <script>
        function changeElements() {
            document.getElementById("heading").textContent =
                "Heading Changed Successfully";

            let paragraphs = document.getElementsByClassName("box");

            for (let i = 0; i < paragraphs.length; i++) {
                paragraphs[i].textContent =
                    "Paragraph " + (i + 1) + " Changed";
                paragraphs[i].style.backgroundColor = "lightblue";
                paragraphs[i].style.color = "darkblue";
            }
        }
    </script>

</body>

</html>

<!DOCTYPE html>
<html>

<head>
    <title>Dynamic Dropdown List</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 80px;
        }

        select {
            padding: 10px;
            width: 250px;
            font-size: 16px;
        }

        button {
            padding: 10px 20px;
            margin: 10px;
            cursor: pointer;
        }

        #output {
            margin-top: 20px;
            font-size: 18px;
        }
    </style>
</head>

<body>

    <h2>Dynamic Dropdown List</h2>

    <button onclick="createDropdown()">Create Dropdown</button>

    <div id="dropdownContainer"></div>

    <div id="output"></div>

    <script>
        function createDropdown() {

            let container = document.getElementById("dropdownContainer");

            // Create dropdown
            let dropdown = document.createElement("select");

            // Options
            let courses = ["HTML", "CSS", "JavaScript", "Python", "Java"];

            courses.forEach(function (course) {

                let option = document.createElement("option");

                option.text = course;
                option.value = course;

                dropdown.appendChild(option);
            });

            // Add dropdown to webpage
            container.appendChild(dropdown);

            // Display selected value
            dropdown.addEventListener("change", function () {
                document.getElementById("output").innerHTML =
                    "Selected Course: " + dropdown.value;
            });
        }
    </script>

    <br><br>

    <a href="../index.html">← Back to JavaScript Programs</a>
    <br><br>
    <a href="../../index.html">← Home</a>

</body>

</html>

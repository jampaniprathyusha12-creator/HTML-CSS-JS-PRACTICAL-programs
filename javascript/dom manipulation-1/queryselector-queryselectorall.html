<!DOCTYPE html>
<html>

<head>
    <title>querySelector and querySelectorAll</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }

        .box {
            padding: 15px;
            margin: 10px;
            border: 1px solid black;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
        }

        #output {
            margin-top: 20px;
            font-size: 18px;
        }
    </style>
</head>

<body>

    <h2 id="heading">DOM Query Selector Methods</h2>

    <p class="box">Paragraph 1</p>
    <p class="box">Paragraph 2</p>
    <p class="box">Paragraph 3</p>

    <button onclick="demonstrateMethods()">Demonstrate</button>

    <div id="output"></div>

    <br>
    <a href="../index.html">← Back to JavaScript Programs</a>
    <br><br>
    <a href="../../index.html">← Home</a>

    <script>
        function demonstrateMethods() {

            // querySelector() selects the first matching element
            let heading = document.querySelector("#heading");
            heading.textContent =
                "Changed Using querySelector()";

            // querySelectorAll() selects all matching elements
            let paragraphs = document.querySelectorAll(".box");

            paragraphs.forEach(function (paragraph, index) {
                paragraph.textContent =
                    "Paragraph " + (index + 1) +
                    " changed using querySelectorAll()";

                paragraph.style.backgroundColor = "lightgreen";
            });

            document.getElementById("output").innerHTML =
                "Both querySelector() and querySelectorAll() demonstrated successfully.";
        }
    </script>

</body>

</html>

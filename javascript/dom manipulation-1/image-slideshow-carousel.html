<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Slideshow / Carousel</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
            background-color: #f5f7ff;
        }

        h2 {
            margin-bottom: 25px;
        }

        #slideImage {
            width: 500px;
            height: 300px;
            object-fit: cover;
            border-radius: 10px;
        }

        button {
            padding: 12px 25px;
            margin: 20px 5px;
            font-size: 18px;
            cursor: pointer;
        }

        .navigation {
            margin-top: 25px;
        }

        .navigation a {
            font-size: 18px;
        }
    </style>
</head>

<body>

    <h2>Image Slideshow / Carousel</h2>

    <img id="slideImage" src="../../assets/images/mountain.jpg" alt="Slideshow Image">

    <br>

    <button onclick="previousImage()">Previous</button>
    <button onclick="nextImage()">Next</button>

    <div class="navigation">
        <a href="../index.html">← Back to JavaScript Programs</a>
        <br><br>
        <a href="../../index.html">← Home</a>
    </div>

    <script>
        const images = [
            "../../assets/images/mountain.jpg",
            "../../assets/images/forest.jpg",
            "../../assets/images/sunset.jpg",
            "../../assets/images/ocean.jpg"
        ];

        let currentIndex = 0;

        const slideImage = document.getElementById("slideImage");

        function nextImage() {
            currentIndex++;

            if (currentIndex >= images.length) {
                currentIndex = 0;
            }

            slideImage.src = images[currentIndex];
        }

        function previousImage() {
            currentIndex--;

            if (currentIndex < 0) {
                currentIndex = images.length - 1;
            }

            slideImage.src = images[currentIndex];
        }
    </script>

</body>

</html>

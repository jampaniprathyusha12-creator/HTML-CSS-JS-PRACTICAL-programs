<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browser Information</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            padding: 40px;
        }

        .container {
            max-width: 650px;
            margin: auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
        }

        h1 {
            text-align: center;
        }

        #output {
            margin-top: 20px;
            padding: 20px;
            background-color: #eeeeee;
            line-height: 1.8;
            word-break: break-word;
        }

        a {
            text-decoration: none;
            color: blue;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Browser Information</h1>

        <div id="output"></div>

        <br>

        <a href="../index.html">← Back to JavaScript Programs</a>
        <br><br>
        <a href="../../index.html">← Home</a>

    </div>

    <script>

        let browserInfo =
            "<strong>Browser Name:</strong> " + navigator.appName + "<br>" +
            "<strong>Browser Version:</strong> " + navigator.appVersion + "<br>" +
            "<strong>Platform:</strong> " + navigator.platform + "<br>" +
            "<strong>Language:</strong> " + navigator.language + "<br>" +
            "<strong>Online Status:</strong> " + (navigator.onLine ? "Online" : "Offline") + "<br>" +
            "<strong>Cookies Enabled:</strong> " + (navigator.cookieEnabled ? "Yes" : "No") + "<br>" +
            "<strong>User Agent:</strong> " + navigator.userAgent;

        document.getElementById("output").innerHTML = browserInfo;

    </script>

</body>

</html>

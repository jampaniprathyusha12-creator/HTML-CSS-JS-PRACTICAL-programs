<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geographical Coordinates</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            text-align: center;
            padding: 50px;
        }

        .container {
            max-width: 550px;
            margin: auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
        }

        button {
            padding: 12px 25px;
            font-size: 16px;
            cursor: pointer;
        }

        #output {
            margin-top: 25px;
            padding: 20px;
            background-color: #eeeeee;
            line-height: 1.8;
        }

        a {
            text-decoration: none;
            color: blue;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Geographical Coordinates</h1>

        <p>Click the button to find your current coordinates.</p>

        <button onclick="getCoordinates()">Get Coordinates</button>

        <div id="output">
            Coordinates will appear here.
        </div>

        <br>

        <a href="../index.html">← Back to JavaScript Programs</a>
        <br><br>
        <a href="../../index.html">← Home</a>

    </div>

    <script>

        function getCoordinates() {

            let output = document.getElementById("output");

            if ("geolocation" in navigator) {

                output.innerHTML = "Requesting location permission...";

                navigator.geolocation.getCurrentPosition(
                    function (position) {

                        let latitude = position.coords.latitude;
                        let longitude = position.coords.longitude;

                        output.innerHTML =
                            "<strong>Current Geographical Coordinates</strong><br><br>" +
                            "Latitude: " + latitude + "<br>" +
                            "Longitude: " + longitude;
                    },

                    function (error) {

                        output.innerHTML =
                            "Unable to retrieve coordinates.<br>" +
                            "Please allow location access in the browser.";
                    }
                );

            } else {

                output.innerHTML =
                    "Geolocation is not supported by this browser.";
            }
        }

    </script>

</body>

</html>

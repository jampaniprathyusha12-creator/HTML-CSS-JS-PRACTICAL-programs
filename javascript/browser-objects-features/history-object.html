<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>History Object Demo</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            text-align: center;
            padding: 50px;
        }

        .container {
            max-width: 550px;
            margin: auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
        }

        button {
            padding: 12px 20px;
            margin: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        #output {
            margin-top: 20px;
            padding: 15px;
            background-color: #eeeeee;
        }

        a {
            text-decoration: none;
            color: blue;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>History Object Demo</h1>

        <p>Number of pages in browser history:</p>

        <button onclick="showHistory()">Show History Length</button>

        <div id="output"></div>

        <br>

        <a href="../index.html">← Back to JavaScript Programs</a>
        <br><br>
        <a href="../../index.html">← Home</a>

    </div>

    <script>

        function showHistory() {

            let historyLength = window.history.length;

            document.getElementById("output").innerHTML =
                "Browser History Length: <strong>" +
                historyLength +
                "</strong>";
        }

    </script>

</body>

</html>

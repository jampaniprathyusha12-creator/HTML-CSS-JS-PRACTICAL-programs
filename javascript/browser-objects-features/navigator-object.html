<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigator Object Demo</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            text-align: center;
            padding: 40px;
        }

        .container {
            max-width: 650px;
            margin: auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
        }

        button {
            padding: 12px 22px;
            font-size: 16px;
            cursor: pointer;
            margin: 10px;
        }

        #output {
            margin-top: 20px;
            padding: 20px;
            background-color: #eeeeee;
            text-align: left;
            line-height: 1.8;
            word-break: break-word;
        }

        a {
            text-decoration: none;
            color: blue;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Navigator Object Demo</h1>

        <p>Click the button to display browser information.</p>

        <button onclick="showNavigator()">Show Navigator Information</button>

        <div id="output"></div>

        <br>

        <a href="../index.html">← Back to JavaScript Programs</a>
        <br><br>
        <a href="../../index.html">← Home</a>

    </div>

    <script>

        function showNavigator() {

            let output = document.getElementById("output");

            output.innerHTML =
                "<strong>Browser:</strong> " + navigator.appName + "<br>" +
                "<strong>Platform:</strong> " + navigator.platform + "<br>" +
                "<strong>Language:</strong> " + navigator.language + "<br>" +
                "<strong>Online:</strong> " + navigator.onLine + "<br>" +
                "<strong>Cookies Enabled:</strong> " + navigator.cookieEnabled + "<br>" +
                "<strong>User Agent:</strong> " + navigator.userAgent;
        }

    </script>

</body>

</html>

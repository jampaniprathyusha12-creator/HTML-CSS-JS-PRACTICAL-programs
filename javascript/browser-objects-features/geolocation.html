<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browser Geolocation</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            text-align: center;
            padding: 50px;
        }

        .container {
            max-width: 550px;
            margin: auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
        }

        button {
            padding: 12px 25px;
            font-size: 16px;
            cursor: pointer;
        }

        #output {
            margin-top: 25px;
            padding: 20px;
            background-color: #eeeeee;
            line-height: 1.8;
        }

        a {
            text-decoration: none;
            color: blue;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Browser Geolocation</h1>

        <p>Click the button to request your geographical location.</p>

        <button onclick="getLocation()">Get My Location</button>

        <div id="output">
            Location information will appear here.
        </div>

        <br>

        <a href="../index.html">← Back to JavaScript Programs</a>
        <br><br>
        <a href="../../index.html">← Home</a>

    </div>

    <script>

        function getLocation() {

            let output = document.getElementById("output");

            if ("geolocation" in navigator) {

                output.innerHTML = "Requesting location permission...";

                navigator.geolocation.getCurrentPosition(
                    function (position) {

                        output.innerHTML =
                            "<strong>Geolocation is supported.</strong><br>" +
                            "Location permission was granted.";
                    },

                    function (error) {

                        output.innerHTML =
                            "<strong>Unable to get location.</strong><br>" +
                            "Please allow location access in the browser.";
                    }
                );

            } else {

                output.innerHTML =
                    "Geolocation is not supported by this browser.";
            }
        }

    </script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browser History Navigation</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            text-align: center;
            padding: 50px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
        }

        button {
            padding: 12px 22px;
            margin: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        a {
            text-decoration: none;
            color: blue;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Browser History Operations</h1>

        <p>Use the buttons to perform browser navigation operations.</p>

        <button onclick="goBack()">← Back</button>

        <button onclick="goForward()">Forward →</button>

        <button onclick="reloadPage()">⟳ Reload</button>

        <br><br>

        <a href="../index.html">← Back to JavaScript Programs</a>
        <br><br>
        <a href="../../index.html">← Home</a>

    </div>

    <script>

        function goBack() {
            window.history.back();
        }

        function goForward() {
            window.history.forward();
        }

        function reloadPage() {
            window.location.reload();
        }

    </script>

</body>

</html>

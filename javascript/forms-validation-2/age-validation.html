<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Age Validation</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 70px;
        }

        .container {
            width: 400px;
            max-width: 90%;
            margin: auto;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            box-sizing: border-box;
            font-size: 16px;
        }

        button {
            padding: 10px 25px;
            margin-top: 15px;
            font-size: 16px;
            cursor: pointer;
        }

        #message {
            margin-top: 20px;
            font-weight: bold;
        }

        a {
            text-decoration: none;
            color: blue;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Age Validation</h1>

        <form id="ageForm">

            <label for="age">Enter Your Age:</label>

            <input type="number" id="age" placeholder="Enter age" min="1">

            <button type="submit">Validate Age</button>

        </form>

        <p id="message"></p>

        <br>

        <a href="../index.html">← Back to JavaScript Programs</a>
        <br><br>
        <a href="../../index.html">← Home</a>

    </div>

    <script>
        document.getElementById("ageForm").addEventListener("submit", function (event) {

            event.preventDefault();

            let age = Number(document.getElementById("age").value);
            let message = document.getElementById("message");

            if (document.getElementById("age").value === "") {
                message.textContent = "Age is required.";
                message.style.color = "red";
            }
            else if (age < 1 || age > 120) {
                message.textContent = "Please enter an age between 1 and 120.";
                message.style.color = "red";
            }
            else {
                message.textContent = "Valid age: " + age;
                message.style.color = "green";
            }
        });
    </script>

</body>

</html>

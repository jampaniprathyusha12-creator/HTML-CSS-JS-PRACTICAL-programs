<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Validation Using Regular Expression</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            padding: 40px;
        }

        .container {
            max-width: 450px;
            margin: auto;
            background-color: white;
            padding: 25px;
            border-radius: 10px;
        }

        h1 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            box-sizing: border-box;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            font-size: 16px;
            cursor: pointer;
        }

        .error {
            color: red;
            font-size: 14px;
        }

        .success {
            color: green;
            text-align: center;
            font-weight: bold;
            margin-top: 20px;
        }

        a {
            text-decoration: none;
            color: blue;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Email Validation</h1>

        <form id="emailForm">

            <label for="email">Email Address:</label>
            <input type="text" id="email" placeholder="Enter your email">

            <span class="error" id="emailError"></span>

            <button type="submit">Validate Email</button>

        </form>

        <p class="success" id="successMessage"></p>

        <br>

        <a href="../index.html">← Back to JavaScript Programs</a>
        <br><br>
        <a href="../../index.html">← Home</a>

    </div>

    <script>
        document.getElementById("emailForm").addEventListener("submit", function (event) {

            event.preventDefault();

            let email = document.getElementById("email").value.trim();

            let emailError = document.getElementById("emailError");
            let successMessage = document.getElementById("successMessage");

            emailError.textContent = "";
            successMessage.textContent = "";

            // Regular expression for email validation
            let emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            if (email === "") {
                emailError.textContent = "Email is required.";
            }
            else if (!emailPattern.test(email)) {
                emailError.textContent = "Enter a valid email address.";
            }
            else {
                successMessage.textContent = "Email is valid!";
            }
        });
    </script>

</body>

</html>

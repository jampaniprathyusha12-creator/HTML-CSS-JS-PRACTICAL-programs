<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkbox Validation</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 60px;
        }

        .container {
            width: 450px;
            max-width: 90%;
            margin: auto;
        }

        .options {
            text-align: left;
            margin-top: 20px;
        }

        .options label {
            display: block;
            margin: 12px 0;
        }

        button {
            padding: 10px 25px;
            margin-top: 20px;
            font-size: 16px;
            cursor: pointer;
        }

        #message {
            margin-top: 20px;
            font-weight: bold;
        }

        a {
            text-decoration: none;
            color: blue;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Checkbox Validation</h1>

        <form id="checkboxForm">

            <p><strong>Select your skills:</strong></p>

            <div class="options">

                <label>
                    <input type="checkbox" name="skill" value="HTML">
                    HTML
                </label>

                <label>
                    <input type="checkbox" name="skill" value="CSS">
                    CSS
                </label>

                <label>
                    <input type="checkbox" name="skill" value="JavaScript">
                    JavaScript
                </label>

                <label>
                    <input type="checkbox" name="skill" value="Python">
                    Python
                </label>

            </div>

            <button type="submit">Submit</button>

        </form>

        <p id="message"></p>

        <br>

        <a href="../index.html">← Back to JavaScript Programs</a>
        <br><br>
        <a href="../../index.html">← Home</a>

    </div>

    <script>
        document.getElementById("checkboxForm").addEventListener("submit", function (event) {

            event.preventDefault();

            let selectedSkills =
                document.querySelectorAll('input[name="skill"]:checked');

            let message = document.getElementById("message");

            if (selectedSkills.length === 0) {
                message.textContent =
                    "Please select at least one skill.";
                message.style.color = "red";
            }
            else {
                let skills = [];

                selectedSkills.forEach(function (skill) {
                    skills.push(skill.value);
                });

                message.textContent =
                    "Selected skills: " + skills.join(", ");
                message.style.color = "green";
            }
        });
    </script>

</body>

</html>

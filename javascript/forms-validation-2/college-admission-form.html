<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Admission Form</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            padding: 30px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background-color: white;
            padding: 25px;
            border-radius: 10px;
        }

        h1 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            box-sizing: border-box;
            font-size: 16px;
        }

        textarea {
            height: 80px;
            resize: vertical;
        }

        .error {
            color: red;
            font-size: 14px;
        }

        .success {
            color: green;
            text-align: center;
            font-weight: bold;
            margin-top: 20px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            font-size: 16px;
            cursor: pointer;
        }

        a {
            text-decoration: none;
            color: blue;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>College Admission Form</h1>

        <form id="admissionForm">

            <label for="name">Student Name:</label>
            <input type="text" id="name" placeholder="Enter your name">
            <span class="error" id="nameError"></span>

            <label for="email">Email:</label>
            <input type="text" id="email" placeholder="Enter your email">
            <span class="error" id="emailError"></span>

            <label for="mobile">Mobile Number:</label>
            <input type="text" id="mobile" placeholder="Enter 10-digit mobile number">
            <span class="error" id="mobileError"></span>

            <label for="dob">Date of Birth:</label>
            <input type="date" id="dob">
            <span class="error" id="dobError"></span>

            <label for="course">Select Course:</label>
            <select id="course">
                <option value="">Select Course</option>
                <option value="B.Tech">B.Tech</option>
                <option value="BCA">BCA</option>
                <option value="B.Sc">B.Sc</option>
                <option value="B.Com">B.Com</option>
            </select>
            <span class="error" id="courseError"></span>

            <label for="address">Address:</label>
            <textarea id="address" placeholder="Enter your address"></textarea>
            <span class="error" id="addressError"></span>

            <button type="submit">Submit Application</button>

        </form>

        <p class="success" id="successMessage"></p>

        <br>

        <a href="../index.html">← Back to JavaScript Programs</a>
        <br><br>
        <a href="../../index.html">← Home</a>

    </div>

    <script>
        document.getElementById("admissionForm").addEventListener("submit", function (event) {

            event.preventDefault();

            let name = document.getElementById("name").value.trim();
            let email = document.getElementById("email").value.trim();
            let mobile = document.getElementById("mobile").value.trim();
            let dob = document.getElementById("dob").value;
            let course = document.getElementById("course").value;
            let address = document.getElementById("address").value.trim();

            let valid = true;

            // Clear previous errors
            document.querySelectorAll(".error").forEach(function (error) {
                error.textContent = "";
            });

            document.getElementById("successMessage").textContent = "";

            // Name validation
            if (name === "") {
                document.getElementById("nameError").textContent =
                    "Student name is required.";
                valid = false;
            }
            else if (!/^[A-Za-z ]+$/.test(name)) {
                document.getElementById("nameError").textContent =
                    "Name must contain only alphabets.";
                valid = false;
            }

            // Email validation
            let emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            if (email === "") {
                document.getElementById("emailError").textContent =
                    "Email is required.";
                valid = false;
            }
            else if (!emailPattern.test(email)) {
                document.getElementById("emailError").textContent =
                    "Enter a valid email address.";
                valid = false;
            }

            // Mobile validation
            let mobilePattern = /^[6-9][0-9]{9}$/;

            if (mobile === "") {
                document.getElementById("mobileError").textContent =
                    "Mobile number is required.";
                valid = false;
            }
            else if (!mobilePattern.test(mobile)) {
                document.getElementById("mobileError").textContent =
                    "Enter a valid 10-digit mobile number.";
                valid = false;
            }

            // Date of birth validation
            if (dob === "") {
                document.getElementById("dobError").textContent =
                    "Date of birth is required.";
                valid = false;
            }

            // Course validation
            if (course === "") {
                document.getElementById("courseError").textContent =
                    "Please select a course.";
                valid = false;
            }

            // Address validation
            if (address === "") {
                document.getElementById("addressError").textContent =
                    "Address is required.";
                valid = false;
            }

            // Final result
            if (valid) {
                document.getElementById("successMessage").textContent =
                    "College admission application submitted successfully!";
            }
        });
    </script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Minimum Length Validation</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 70px;
        }

        .container {
            width: 400px;
            max-width: 90%;
            margin: auto;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            box-sizing: border-box;
            font-size: 16px;
        }

        button {
            padding: 10px 25px;
            margin-top: 15px;
            font-size: 16px;
            cursor: pointer;
        }

        #message {
            margin-top: 20px;
            font-weight: bold;
        }

        a {
            text-decoration: none;
            color: blue;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Password Validation</h1>

        <form id="passwordForm">

            <label for="password">Enter Password:</label>

            <input type="password" id="password" placeholder="Minimum 8 characters">

            <button type="submit">Validate Password</button>

        </form>

        <p id="message"></p>

        <br>

        <a href="../index.html">← Back to JavaScript Programs</a>
        <br><br>
        <a href="../../index.html">← Home</a>

    </div>

    <script>
        document.getElementById("passwordForm").addEventListener("submit", function (event) {

            event.preventDefault();

            let password = document.getElementById("password").value;
            let message = document.getElementById("message");

            if (password === "") {
                message.textContent = "Password is required.";
                message.style.color = "red";
            }
            else if (password.length < 8) {
                message.textContent =
                    "Password must contain at least 8 characters.";
                message.style.color = "red";
            }
            else {
                message.textContent = "Valid password!";
                message.style.color = "green";
            }
        });
    </script>

</body>

</html>

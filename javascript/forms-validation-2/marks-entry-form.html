<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marks Calculator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            padding: 30px;
        }

        .container {
            max-width: 450px;
            margin: auto;
            background-color: white;
            padding: 25px;
            border-radius: 10px;
        }

        h1 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 12px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
            font-size: 16px;
        }

        button {
            padding: 10px 20px;
            margin-top: 20px;
            font-size: 16px;
            cursor: pointer;
        }

        .result {
            margin-top: 20px;
            padding: 15px;
            background-color: #eeeeee;
            line-height: 1.8;
        }

        .error {
            color: red;
        }

        a {
            text-decoration: none;
            color: blue;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Marks Calculator</h1>

        <form id="marksForm">

            <label for="mark1">Subject 1:</label>
            <input type="number" id="mark1" min="0" max="100">

            <label for="mark2">Subject 2:</label>
            <input type="number" id="mark2" min="0" max="100">

            <label for="mark3">Subject 3:</label>
            <input type="number" id="mark3" min="0" max="100">

            <p class="error" id="errorMessage"></p>

            <button type="submit">Calculate</button>

        </form>

        <div class="result" id="result">
            Total: -<br>
            Average: -<br>
            Grade: -
        </div>

        <br>

        <a href="../index.html">← Back to JavaScript Programs</a>
        <br><br>
        <a href="../../index.html">← Home</a>

    </div>

    <script>
        document.getElementById("marksForm").addEventListener("submit", function (event) {

            event.preventDefault();

            let mark1 = document.getElementById("mark1").value;
            let mark2 = document.getElementById("mark2").value;
            let mark3 = document.getElementById("mark3").value;

            let errorMessage = document.getElementById("errorMessage");
            let result = document.getElementById("result");

            errorMessage.textContent = "";

            if (mark1 === "" || mark2 === "" || mark3 === "") {
                errorMessage.textContent = "Please enter all marks.";
                return;
            }

            mark1 = Number(mark1);
            mark2 = Number(mark2);
            mark3 = Number(mark3);

            if (
                mark1 < 0 || mark1 > 100 ||
                mark2 < 0 || mark2 > 100 ||
                mark3 < 0 || mark3 > 100
            ) {
                errorMessage.textContent =
                    "Marks must be between 0 and 100.";
                return;
            }

            let total = mark1 + mark2 + mark3;
            let average = total / 3;

            let grade;

            if (average >= 90) {
                grade = "A";
            }
            else if (average >= 80) {
                grade = "B";
            }
            else if (average >= 70) {
                grade = "C";
            }
            else if (average >= 60) {
                grade = "D";
            }
            else if (average >= 50) {
                grade = "E";
            }
            else {
                grade = "F";
            }

            result.innerHTML =
                "Total: " + total + "<br>" +
                "Average: " + average.toFixed(2) + "<br>" +
                "Grade: " + grade;
        });
    </script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Name Validation</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 70px;
        }

        .container {
            width: 400px;
            max-width: 90%;
            margin: auto;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            box-sizing: border-box;
            font-size: 16px;
        }

        button {
            padding: 10px 25px;
            margin-top: 15px;
            font-size: 16px;
            cursor: pointer;
        }

        #message {
            margin-top: 20px;
            font-weight: bold;
        }

        a {
            text-decoration: none;
            color: blue;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Name Validation</h1>

        <form id="nameForm">

            <label for="name">Enter Your Name:</label>

            <input type="text" id="name" placeholder="Enter name">

            <button type="submit">Validate</button>

        </form>

        <p id="message"></p>

        <br>

        <a href="../index.html">← Back to JavaScript Programs</a>
        <br><br>
        <a href="../../index.html">← Home</a>

    </div>

    <script>
        document.getElementById("nameForm").addEventListener("submit", function (event) {

            event.preventDefault();

            let name = document.getElementById("name").value.trim();
            let message = document.getElementById("message");

            // Regular expression for alphabets and spaces
            let namePattern = /^[A-Za-z ]+$/;

            if (name === "") {
                message.textContent = "Name is required.";
                message.style.color = "red";
            }
            else if (!namePattern.test(name)) {
                message.textContent =
                    "Invalid name. Only alphabets are allowed.";
                message.style.color = "red";
            }
            else {
                message.textContent = "Valid name!";
                message.style.color = "green";
            }
        });
    </script>

</body>

</html>

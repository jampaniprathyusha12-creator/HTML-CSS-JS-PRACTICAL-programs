<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strong Password Validator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 60px;
        }

        .container {
            width: 450px;
            max-width: 90%;
            margin: auto;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            box-sizing: border-box;
            font-size: 16px;
        }

        button {
            padding: 10px 25px;
            margin-top: 15px;
            font-size: 16px;
            cursor: pointer;
        }

        #message {
            margin-top: 20px;
            font-weight: bold;
        }

        .requirements {
            text-align: left;
            margin-top: 20px;
            line-height: 1.8;
        }

        a {
            text-decoration: none;
            color: blue;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Strong Password Validator</h1>

        <p>Password should contain:</p>

        <ul class="requirements">
            <li>At least 8 characters</li>
            <li>At least one uppercase letter</li>
            <li>At least one lowercase letter</li>
            <li>At least one number</li>
            <li>At least one special character</li>
        </ul>

        <form id="passwordForm">

            <input type="password" id="password" placeholder="Enter strong password">

            <button type="submit">Validate Password</button>

        </form>

        <p id="message"></p>

        <br>

        <a href="../index.html">← Back to JavaScript Programs</a>
        <br><br>
        <a href="../../index.html">← Home</a>

    </div>

    <script>
        document.getElementById("passwordForm").addEventListener("submit", function (event) {

            event.preventDefault();

            let password = document.getElementById("password").value;
            let message = document.getElementById("message");

            // Regular expressions for password requirements
            let upperCase = /[A-Z]/;
            let lowerCase = /[a-z]/;
            let number = /[0-9]/;
            let specialCharacter = /[!@#$%^&*]/;

            if (password === "") {
                message.textContent = "Password is required.";
                message.style.color = "red";
            }
            else if (password.length < 8) {
                message.textContent =
                    "Password must contain at least 8 characters.";
                message.style.color = "red";
            }
            else if (!upperCase.test(password)) {
                message.textContent =
                    "Password must contain an uppercase letter.";
                message.style.color = "red";
            }
            else if (!lowerCase.test(password)) {
                message.textContent =
                    "Password must contain a lowercase letter.";
                message.style.color = "red";
            }
            else if (!number.test(password)) {
                message.textContent =
                    "Password must contain a number.";
                message.style.color = "red";
            }
            else if (!specialCharacter.test(password)) {
                message.textContent =
                    "Password must contain a special character.";
                message.style.color = "red";
            }
            else {
                message.textContent = "Strong password!";
                message.style.color = "green";
            }
        });
    </script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Preview</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            padding: 30px;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background-color: white;
            padding: 25px;
            border-radius: 10px;
        }

        h1,
        h2 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
            font-size: 16px;
        }

        button {
            padding: 10px 20px;
            margin-top: 20px;
            cursor: pointer;
            font-size: 16px;
        }

        .preview {
            display: none;
            margin-top: 25px;
            padding: 20px;
            background-color: #eeeeee;
            border-radius: 8px;
        }

        .error {
            color: red;
            font-size: 14px;
        }

        .success {
            color: green;
            font-weight: bold;
            text-align: center;
        }

        a {
            text-decoration: none;
            color: blue;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Student Registration</h1>

        <form id="registrationForm">

            <label for="name">Name:</label>
            <input type="text" id="name" placeholder="Enter your name">
            <span class="error" id="nameError"></span>

            <label for="email">Email:</label>
            <input type="text" id="email" placeholder="Enter your email">
            <span class="error" id="emailError"></span>

            <label for="course">Course:</label>
            <select id="course">
                <option value="">Select Course</option>
                <option value="B.Tech">B.Tech</option>
                <option value="BCA">BCA</option>
                <option value="B.Sc">B.Sc</option>
            </select>
            <span class="error" id="courseError"></span>

            <button type="submit">Preview</button>

        </form>

        <!-- Preview Section -->
        <div class="preview" id="preview">

            <h2>Entered Information</h2>

            <p><strong>Name:</strong> <span id="previewName"></span></p>
            <p><strong>Email:</strong> <span id="previewEmail"></span></p>
            <p><strong>Course:</strong> <span id="previewCourse"></span></p>

            <button type="button" id="confirmButton">
                Confirm & Submit
            </button>

        </div>

        <p class="success" id="successMessage"></p>

        <br>

        <a href="../index.html">← Back to JavaScript Programs</a>
        <br><br>
        <a href="../../index.html">← Home</a>

    </div>

    <script>
        document.getElementById("registrationForm").addEventListener("submit", function (event) {

            event.preventDefault();

            let name = document.getElementById("name").value.trim();
            let email = document.getElementById("email").value.trim();
            let course = document.getElementById("course").value;

            document.getElementById("nameError").textContent = "";
            document.getElementById("emailError").textContent = "";
            document.getElementById("courseError").textContent = "";

            let valid = true;

            let emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            if (name === "") {
                document.getElementById("nameError").textContent =
                    "Name is required.";
                valid = false;
            }

            if (!emailPattern.test(email)) {
                document.getElementById("emailError").textContent =
                    "Enter a valid email.";
                valid = false;
            }

            if (course === "") {
                document.getElementById("courseError").textContent =
                    "Please select a course.";
                valid = false;
            }

            if (valid) {

                // Display entered information
                document.getElementById("previewName").textContent = name;
                document.getElementById("previewEmail").textContent = email;
                document.getElementById("previewCourse").textContent = course;

                document.getElementById("preview").style.display = "block";
                document.getElementById("successMessage").textContent = "";
            }
        });

        // Confirm submission
        document.getElementById("confirmButton").addEventListener("click", function () {

            document.getElementById("successMessage").textContent =
                "Registration submitted successfully!";

            document.getElementById("preview").style.display = "none";

            document.getElementById("registrationForm").reset();
        });
    </script>

</body>

</html>

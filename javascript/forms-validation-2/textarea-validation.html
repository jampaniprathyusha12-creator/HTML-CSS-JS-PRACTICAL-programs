<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Textarea Validation</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 60px;
        }

        .container {
            width: 500px;
            max-width: 90%;
            margin: auto;
        }

        textarea {
            width: 100%;
            height: 150px;
            padding: 12px;
            margin-top: 10px;
            box-sizing: border-box;
            font-size: 16px;
            resize: vertical;
        }

        button {
            padding: 10px 25px;
            margin-top: 20px;
            font-size: 16px;
            cursor: pointer;
        }

        #message {
            margin-top: 20px;
            font-weight: bold;
        }

        a {
            text-decoration: none;
            color: blue;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Textarea Validation</h1>

        <form id="feedbackForm">

            <label for="feedback">
                <strong>Enter Your Feedback:</strong>
            </label>

            <textarea id="feedback" placeholder="Enter at least 10 characters..."></textarea>

            <button type="submit">Submit</button>

        </form>

        <p id="message"></p>

        <br>

        <a href="../index.html">← Back to JavaScript Programs</a>
        <br><br>
        <a href="../../index.html">← Home</a>

    </div>

    <script>
        document.getElementById("feedbackForm").addEventListener("submit", function (event) {

            event.preventDefault();

            let feedback =
                document.getElementById("feedback").value.trim();

            let message =
                document.getElementById("message");

            if (feedback === "") {
                message.textContent =
                    "Feedback is required.";
                message.style.color = "red";
            }
            else if (feedback.length < 10) {
                message.textContent =
                    "Feedback must contain at least 10 characters.";
                message.style.color = "red";
            }
            else {
                message.textContent =
                    "Feedback submitted successfully!";
                message.style.color = "green";
            }
        });
    </script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio Button Validation</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 70px;
        }

        .container {
            width: 400px;
            max-width: 90%;
            margin: auto;
        }

        .options {
            text-align: left;
            margin-top: 20px;
        }

        .options label {
            display: block;
            margin: 12px 0;
        }

        button {
            padding: 10px 25px;
            margin-top: 20px;
            font-size: 16px;
            cursor: pointer;
        }

        #message {
            margin-top: 20px;
            font-weight: bold;
        }

        a {
            text-decoration: none;
            color: blue;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Radio Button Validation</h1>

        <form id="radioForm">

            <p><strong>Select your study mode:</strong></p>

            <div class="options">

                <label>
                    <input type="radio" name="mode" value="Online">
                    Online
                </label>

                <label>
                    <input type="radio" name="mode" value="Offline">
                    Offline
                </label>

                <label>
                    <input type="radio" name="mode" value="Hybrid">
                    Hybrid
                </label>

            </div>

            <button type="submit">Submit</button>

        </form>

        <p id="message"></p>

        <br>

        <a href="../index.html">← Back to JavaScript Programs</a>
        <br><br>
        <a href="../../index.html">← Home</a>

    </div>

    <script>
        document.getElementById("radioForm").addEventListener("submit", function (event) {

            event.preventDefault();

            let selected =
                document.querySelector('input[name="mode"]:checked');

            let message = document.getElementById("message");

            if (selected === null) {
                message.textContent =
                    "Please select one study mode.";
                message.style.color = "red";
            }
            else {
                message.textContent =
                    "Selected mode: " + selected.value;
                message.style.color = "green";
            }
        });
    </script>

</body>

</html>

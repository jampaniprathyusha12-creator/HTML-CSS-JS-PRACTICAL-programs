<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Number Validation</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 70px;
        }

        .container {
            width: 400px;
            max-width: 90%;
            margin: auto;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            box-sizing: border-box;
            font-size: 16px;
        }

        button {
            padding: 10px 25px;
            margin-top: 15px;
            font-size: 16px;
            cursor: pointer;
        }

        #message {
            margin-top: 20px;
            font-weight: bold;
        }

        a {
            text-decoration: none;
            color: blue;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Mobile Number Validation</h1>

        <form id="mobileForm">

            <label for="mobile">Enter Mobile Number:</label>

            <input type="text" id="mobile" placeholder="Enter 10-digit mobile number" maxlength="10">

            <button type="submit">Validate</button>

        </form>

        <p id="message"></p>

        <br>

        <a href="../index.html">← Back to JavaScript Programs</a>
        <br><br>
        <a href="../../index.html">← Home</a>

    </div>

    <script>
        document.getElementById("mobileForm").addEventListener("submit", function (event) {

            event.preventDefault();

            let mobile = document.getElementById("mobile").value.trim();
            let message = document.getElementById("message");

            // Regular expression for a 10-digit Indian mobile number
            let mobilePattern = /^[6-9][0-9]{9}$/;

            if (mobile === "") {
                message.textContent = "Mobile number is required.";
                message.style.color = "red";
            }
            else if (!mobilePattern.test(mobile)) {
                message.textContent =
                    "Invalid mobile number. Enter a valid 10-digit number.";
                message.style.color = "red";
            }
            else {
                message.textContent = "Valid mobile number!";
                message.style.color = "green";
            }
        });
    </script>

</body>

</html>

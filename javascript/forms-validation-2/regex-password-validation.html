<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Validation Using Regular Expression</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            padding: 40px;
        }

        .container {
            max-width: 450px;
            margin: auto;
            background-color: white;
            padding: 25px;
            border-radius: 10px;
        }

        h1 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            box-sizing: border-box;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            font-size: 16px;
            cursor: pointer;
        }

        .error {
            color: red;
            font-size: 14px;
        }

        .success {
            color: green;
            text-align: center;
            font-weight: bold;
            margin-top: 20px;
        }

        .hint {
            color: #555;
            font-size: 14px;
            margin-top: 8px;
        }

        a {
            text-decoration: none;
            color: blue;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Password Validation</h1>

        <form id="passwordForm">

            <label for="password">Password:</label>

            <input type="password" id="password" placeholder="Enter password">

            <p class="hint">
                Password must contain at least 8 characters,
                one uppercase letter, one lowercase letter,
                and one number.
            </p>

            <span class="error" id="passwordError"></span>

            <button type="submit">Validate Password</button>

        </form>

        <p class="success" id="successMessage"></p>

        <br>

        <a href="../index.html">← Back to JavaScript Programs</a>
        <br><br>
        <a href="../../index.html">← Home</a>

    </div>

    <script>
        document.getElementById("passwordForm").addEventListener("submit", function (event) {

            event.preventDefault();

            let password = document.getElementById("password").value;

            let passwordError = document.getElementById("passwordError");
            let successMessage = document.getElementById("successMessage");

            passwordError.textContent = "";
            successMessage.textContent = "";

            // Regular expression for password validation
            let passwordPattern =
                /^(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9]).{8,}$/;

            if (password === "") {
                passwordError.textContent = "Password is required.";
            }
            else if (!passwordPattern.test(password)) {
                passwordError.textContent =
                    "Password must have 8 characters, uppercase, lowercase and a number.";
            }
            else {
                successMessage.textContent =
                    "Password is valid!";
            }
        });
    </script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback Form</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            padding: 30px;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background-color: white;
            padding: 25px;
            border-radius: 10px;
        }

        h1 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            box-sizing: border-box;
            font-size: 16px;
        }

        textarea {
            height: 100px;
            resize: vertical;
        }

        .error {
            color: red;
            font-size: 14px;
        }

        .success {
            color: green;
            text-align: center;
            font-weight: bold;
            margin-top: 20px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            font-size: 16px;
            cursor: pointer;
        }

        a {
            text-decoration: none;
            color: blue;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Feedback Form</h1>

        <form id="feedbackForm">

            <label for="name">Name:</label>
            <input type="text" id="name" placeholder="Enter your name">
            <span class="error" id="nameError"></span>

            <label for="email">Email:</label>
            <input type="text" id="email" placeholder="Enter your email">
            <span class="error" id="emailError"></span>

            <label for="rating">Rating:</label>
            <select id="rating">
                <option value="">Select Rating</option>
                <option value="5">Excellent</option>
                <option value="4">Very Good</option>
                <option value="3">Good</option>
                <option value="2">Fair</option>
                <option value="1">Poor</option>
            </select>
            <span class="error" id="ratingError"></span>

            <label for="comments">Comments:</label>
            <textarea id="comments" placeholder="Enter your feedback"></textarea>
            <span class="error" id="commentsError"></span>

            <button type="submit">Submit Feedback</button>

        </form>

        <p class="success" id="successMessage"></p>

        <br>

        <a href="../index.html">← Back to JavaScript Programs</a>
        <br><br>
        <a href="../../index.html">← Home</a>

    </div>

    <script>
        document.getElementById("feedbackForm").addEventListener("submit", function (event) {

            event.preventDefault();

            let name = document.getElementById("name").value.trim();
            let email = document.getElementById("email").value.trim();
            let rating = document.getElementById("rating").value;
            let comments = document.getElementById("comments").value.trim();

            let valid = true;

            // Clear previous errors
            document.querySelectorAll(".error").forEach(function (error) {
                error.textContent = "";
            });

            document.getElementById("successMessage").textContent = "";

            // Name validation
            if (name === "") {
                document.getElementById("nameError").textContent =
                    "Name is required.";
                valid = false;
            }
            else if (!/^[A-Za-z ]+$/.test(name)) {
                document.getElementById("nameError").textContent =
                    "Name must contain only alphabets.";
                valid = false;
            }

            // Email validation
            let emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            if (email === "") {
                document.getElementById("emailError").textContent =
                    "Email is required.";
                valid = false;
            }
            else if (!emailPattern.test(email)) {
                document.getElementById("emailError").textContent =
                    "Enter a valid email address.";
                valid = false;
            }

            // Rating validation
            if (rating === "") {
                document.getElementById("ratingError").textContent =
                    "Please select a rating.";
                valid = false;
            }

            // Comments validation
            if (comments === "") {
                document.getElementById("commentsError").textContent =
                    "Please enter your feedback.";
                valid = false;
            }

            if (valid) {
                document.getElementById("successMessage").textContent =
                    "Thank you! Your feedback was submitted successfully.";
            }
        });
    </script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Validation Without Reload</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            padding: 30px;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background-color: white;
            padding: 25px;
            border-radius: 10px;
        }

        h1 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
            font-size: 16px;
        }

        textarea {
            height: 100px;
            resize: vertical;
        }

        button {
            padding: 10px 20px;
            margin-top: 20px;
            font-size: 16px;
            cursor: pointer;
        }

        .error {
            color: red;
            font-size: 14px;
            display: block;
            margin-top: 4px;
        }

        .success {
            color: green;
            font-weight: bold;
            text-align: center;
            margin-top: 20px;
        }

        a {
            text-decoration: none;
            color: blue;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Contact Form</h1>

        <form id="contactForm">

            <label for="name">Name:</label>
            <input type="text" id="name" placeholder="Enter your name">
            <span class="error" id="nameError"></span>

            <label for="email">Email:</label>
            <input type="text" id="email" placeholder="Enter your email">
            <span class="error" id="emailError"></span>

            <label for="mobile">Mobile Number:</label>
            <input type="text" id="mobile" placeholder="Enter 10-digit mobile number">
            <span class="error" id="mobileError"></span>

            <label for="message">Message:</label>
            <textarea id="message" placeholder="Enter your message"></textarea>
            <span class="error" id="messageError"></span>

            <button type="submit">Submit</button>

        </form>

        <p class="success" id="successMessage"></p>

        <br>

        <a href="../index.html">← Back to JavaScript Programs</a>
        <br><br>
        <a href="../../index.html">← Home</a>

    </div>

    <script>
        document.getElementById("contactForm").addEventListener("submit", function (event) {

            // Prevent page reload
            event.preventDefault();

            let name = document.getElementById("name").value.trim();
            let email = document.getElementById("email").value.trim();
            let mobile = document.getElementById("mobile").value.trim();
            let message = document.getElementById("message").value.trim();

            // Clear previous errors
            document.getElementById("nameError").textContent = "";
            document.getElementById("emailError").textContent = "";
            document.getElementById("mobileError").textContent = "";
            document.getElementById("messageError").textContent = "";
            document.getElementById("successMessage").textContent = "";

            let valid = true;

            let namePattern = /^[A-Za-z ]+$/;
            let emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            let mobilePattern = /^[6-9][0-9]{9}$/;

            // Name validation
            if (name === "") {
                document.getElementById("nameError").textContent =
                    "Name is required.";
                valid = false;
            }
            else if (!namePattern.test(name)) {
                document.getElementById("nameError").textContent =
                    "Name should contain only alphabets.";
                valid = false;
            }

            // Email validation
            if (email === "") {
                document.getElementById("emailError").textContent =
                    "Email is required.";
                valid = false;
            }
            else if (!emailPattern.test(email)) {
                document.getElementById("emailError").textContent =
                    "Enter a valid email address.";
                valid = false;
            }

            // Mobile validation
            if (mobile === "") {
                document.getElementById("mobileError").textContent =
                    "Mobile number is required.";
                valid = false;
            }
            else if (!mobilePattern.test(mobile)) {
                document.getElementById("mobileError").textContent =
                    "Enter a valid 10-digit mobile number.";
                valid = false;
            }

            // Message validation
            if (message === "") {
                document.getElementById("messageError").textContent =
                    "Message is required.";
                valid = false;
            }

            // Final result
            if (valid) {
                document.getElementById("successMessage").textContent =
                    "Form submitted successfully without page reload!";

                document.getElementById("contactForm").reset();
            }
        });
    </script>

</body>

</html>

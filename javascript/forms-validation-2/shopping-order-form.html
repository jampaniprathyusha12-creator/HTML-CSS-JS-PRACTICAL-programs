<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Order Form</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            padding: 30px;
        }

        .container {
            max-width: 450px;
            margin: auto;
            background-color: white;
            padding: 25px;
            border-radius: 10px;
        }

        h1 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        select,
        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
            font-size: 16px;
        }

        button {
            padding: 10px 20px;
            margin-top: 20px;
            font-size: 16px;
            cursor: pointer;
        }

        .result {
            margin-top: 20px;
            padding: 15px;
            background-color: #eeeeee;
            line-height: 1.8;
        }

        .error {
            color: red;
        }

        a {
            text-decoration: none;
            color: blue;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Shopping Order</h1>

        <form id="orderForm">

            <label for="product">Select Product:</label>

            <select id="product">
                <option value="">Select Product</option>
                <option value="Laptop" data-price="50000">Laptop - ₹50,000</option>
                <option value="Headphones" data-price="2000">Headphones - ₹2,000</option>
                <option value="Keyboard" data-price="1500">Keyboard - ₹1,500</option>
                <option value="Mouse" data-price="800">Mouse - ₹800</option>
            </select>

            <label for="quantity">Quantity:</label>
            <input type="number" id="quantity" min="1" placeholder="Enter quantity">

            <p class="error" id="errorMessage"></p>

            <button type="submit">Calculate Total</button>

        </form>

        <div class="result" id="result">
            Total price will be displayed here.
        </div>

        <br>

        <a href="../index.html">← Back to JavaScript Programs</a>
        <br><br>
        <a href="../../index.html">← Home</a>

    </div>

    <script>
        document.getElementById("orderForm").addEventListener("submit", function (event) {

            event.preventDefault();

            let product = document.getElementById("product");
            let quantity = document.getElementById("quantity").value;

            let errorMessage = document.getElementById("errorMessage");
            let result = document.getElementById("result");

            errorMessage.textContent = "";

            if (product.value === "") {
                errorMessage.textContent =
                    "Please select a product.";
                return;
            }

            if (quantity === "" || Number(quantity) <= 0) {
                errorMessage.textContent =
                    "Please enter a valid quantity.";
                return;
            }

            quantity = Number(quantity);

            let selectedOption =
                product.options[product.selectedIndex];

            let price =
                Number(selectedOption.getAttribute("data-price"));

            let total = price * quantity;

            result.innerHTML =
                "<strong>Product:</strong> " + product.value + "<br>" +
                "<strong>Price:</strong> ₹" + price.toFixed(2) + "<br>" +
                "<strong>Quantity:</strong> " + quantity + "<br>" +
                "<strong>Total Price:</strong> ₹" + total.toFixed(2);
        });
    </script>

</body>

</html>

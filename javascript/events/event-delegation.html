<!DOCTYPE html>
<html>

<head>
    <title>Event Delegation</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 60px;
        }

        ul {
            width: 300px;
            margin: 20px auto;
            padding: 0;
            list-style: none;
        }

        li {
            padding: 12px;
            margin: 8px;
            background-color: lightblue;
            border: 1px solid black;
            cursor: pointer;
        }

        #output {
            font-size: 18px;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <h2>Event Delegation</h2>

    <p>Click any item:</p>

    <ul id="itemList">
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
        <li>Python</li>
        <li>Java</li>
    </ul>

    <p id="output">Selected item will appear here.</p>

    <script>
        let itemList = document.getElementById("itemList");
        let output = document.getElementById("output");

        // Event delegation
        itemList.addEventListener("click", function (event) {

            if (event.target.tagName === "LI") {

                output.innerHTML =
                    "You selected: " + event.target.innerHTML;

                event.target.style.backgroundColor = "lightgreen";
            }
        });
    </script>

    <br>

    <a href="../index.html">← Back to JavaScript Programs</a>
    <br><br>
    <a href="../../index.html">← Home</a>

</body>

</html>

<!DOCTYPE html>
<html>

<head>
    <title>Mouse Events</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 70px;
        }

        #box {
            width: 300px;
            height: 150px;
            margin: 30px auto;
            background-color: lightblue;
            border: 2px solid black;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        button {
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
        }

        #output {
            font-size: 18px;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <h2>Mouse Events Demonstration</h2>

    <div id="box">
        Move, Click or Double-Click Me
    </div>

    <button id="clickButton">Click Me</button>

    <p id="output">Mouse event will be displayed here.</p>

    <script>
        let box = document.getElementById("box");
        let button = document.getElementById("clickButton");
        let output = document.getElementById("output");

        // Mouse Over Event
        box.addEventListener("mouseover", function () {
            output.innerHTML = "Mouse Over Event occurred";
            box.style.backgroundColor = "lightgreen";
        });

        // Mouse Out Event
        box.addEventListener("mouseout", function () {
            output.innerHTML = "Mouse Out Event occurred";
            box.style.backgroundColor = "lightblue";
        });

        // Click Event
        box.addEventListener("click", function () {
            output.innerHTML = "Click Event occurred";
        });

        // Double Click Event
        box.addEventListener("dblclick", function () {
            output.innerHTML = "Double-Click Event occurred";
        });

        // Mouse Down Event
        box.addEventListener("mousedown", function () {
            output.innerHTML = "Mouse Down Event occurred";
        });

        // Mouse Up Event
        box.addEventListener("mouseup", function () {
            output.innerHTML = "Mouse Up Event occurred";
        });

        // Button Click
        button.addEventListener("click", function () {
            output.innerHTML = "Button Click Event occurred";
        });
    </script>

    <br>

    <a href="../index.html">← Back to JavaScript Programs</a>
    <br><br>
    <a href="../../index.html">← Home</a>

</body>

</html>

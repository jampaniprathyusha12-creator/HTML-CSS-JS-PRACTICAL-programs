<!DOCTYPE html>
<html>

<head>
    <title>Drag and Drop</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }

        #dragItem {
            width: 120px;
            padding: 20px;
            margin: 30px auto;
            background-color: lightblue;
            border: 2px solid black;
            cursor: grab;
        }

        #dropArea {
            width: 300px;
            height: 150px;
            margin: 30px auto;
            border: 3px dashed black;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: lightgray;
        }

        #output {
            font-size: 18px;
        }
    </style>
</head>

<body>

    <h2>Drag and Drop Application</h2>

    <div id="dragItem" draggable="true">
        Drag Me
    </div>

    <div id="dropArea">
        Drop Here
    </div>

    <p id="output">Drag the box into the drop area.</p>

    <script>
        let dragItem = document.getElementById("dragItem");
        let dropArea = document.getElementById("dropArea");
        let output = document.getElementById("output");

        // Drag Start
        dragItem.addEventListener("dragstart", function (event) {
            event.dataTransfer.setData("text", event.target.id);
            output.innerHTML = "Dragging started...";
        });

        // Drag Over
        dropArea.addEventListener("dragover", function (event) {
            event.preventDefault();
            dropArea.style.backgroundColor = "lightgreen";
        });

        // Drop
        dropArea.addEventListener("drop", function (event) {
            event.preventDefault();

            let id = event.dataTransfer.getData("text");
            let item = document.getElementById(id);

            dropArea.appendChild(item);

            dropArea.style.backgroundColor = "lightgreen";
            output.innerHTML = "Item dropped successfully!";
        });
    </script>

    <br>

    <a href="../index.html">← Back to JavaScript Programs</a>
    <br><br>
    <a href="../../index.html">← Home</a>

</body>

</html>

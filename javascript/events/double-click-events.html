<!DOCTYPE html>
<html>

<head>
    <title>Double Click Event</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 80px;
        }

        #box {
            width: 300px;
            height: 150px;
            margin: 30px auto;
            background-color: lightblue;
            border: 2px solid black;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
        }

        #output {
            font-size: 20px;
        }
    </style>
</head>

<body>

    <h2>Double-Click Event</h2>

    <div id="box">
        Double-Click Me
    </div>

    <p id="output">Double-click the box.</p>

    <script>
        let box = document.getElementById("box");
        let output = document.getElementById("output");

        box.addEventListener("dblclick", function () {
            box.style.backgroundColor = "lightgreen";
            box.innerHTML = "Double Click Detected!";
            output.innerHTML = "The double-click event occurred.";
        });
    </script>

</body>

</html>

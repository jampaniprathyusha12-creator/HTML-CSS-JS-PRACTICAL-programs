<!DOCTYPE html>
<html>

<head>
    <title>Event Bubbling and Capturing</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 60px;
        }

        #outer {
            background-color: lightblue;
            padding: 40px;
            width: 350px;
            margin: auto;
            border: 2px solid black;
        }

        #inner {
            background-color: lightgreen;
            padding: 30px;
            border: 2px solid black;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
        }

        #output {
            margin-top: 25px;
            font-size: 18px;
        }
    </style>
</head>

<body>

    <h2>Event Bubbling and Capturing</h2>

    <div id="outer">

        Outer Div

        <div id="inner">

            Inner Div
            <br><br>

            <button id="myButton">Click Me</button>

        </div>

    </div>

    <p id="output">Click the button to see the event order.</p>

    <script>
        let outer = document.getElementById("outer");
        let inner = document.getElementById("inner");
        let button = document.getElementById("myButton");
        let output = document.getElementById("output");

        // Capturing Phase
        outer.addEventListener("click", function () {
            output.innerHTML += "<br>Outer Div - Capturing";
        }, true);

        inner.addEventListener("click", function () {
            output.innerHTML += "<br>Inner Div - Capturing";
        }, true);

        // Bubbling Phase
        button.addEventListener("click", function () {
            output.innerHTML += "<br>Button - Target";
        });

        inner.addEventListener("click", function () {
            output.innerHTML += "<br>Inner Div - Bubbling";
        });

        outer.addEventListener("click", function () {
            output.innerHTML += "<br>Outer Div - Bubbling";
        });
    </script>

    <br>

    <a href="../index.html">← Back to JavaScript Programs</a>
    <br><br>
    <a href="../../index.html">← Home</a>

</body>

</html>

<!DOCTYPE html>
<html>

<head>
    <title>Form Events</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 60px;
        }

        form {
            width: 350px;
            margin: auto;
        }

        input,
        select {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            font-size: 16px;
            box-sizing: border-box;
        }

        button {
            padding: 10px 25px;
            cursor: pointer;
        }

        #output {
            margin-top: 20px;
            font-size: 18px;
        }
    </style>
</head>

<body>

    <h2>Form Events Demonstration</h2>

    <form id="myForm">

        <input type="text" id="name" placeholder="Enter your name">

        <select id="course">
            <option value="">Select Course</option>
            <option value="HTML">HTML</option>
            <option value="CSS">CSS</option>
            <option value="JavaScript">JavaScript</option>
        </select>

        <button type="submit">Submit</button>

    </form>

    <p id="output">Form event will be displayed here.</p>

    <script>
        let form = document.getElementById("myForm");
        let nameInput = document.getElementById("name");
        let course = document.getElementById("course");
        let output = document.getElementById("output");

        // Focus Event
        nameInput.addEventListener("focus", function () {
            output.innerHTML = "Input field is focused.";
        });

        // Blur Event
        nameInput.addEventListener("blur", function () {
            output.innerHTML = "Input field lost focus.";
        });

        // Change Event
        course.addEventListener("change", function () {
            output.innerHTML =
                "Selected Course: " + course.value;
        });

        // Submit Event
        form.addEventListener("submit", function (event) {
            event.preventDefault();

            output.innerHTML =
                "Form submitted successfully!";
        });
    </script>

    <br>

    <a href="../index.html">← Back to JavaScript Programs</a>
    <br><br>
    <a href="../../index.html">← Home</a>

</body>

</html>

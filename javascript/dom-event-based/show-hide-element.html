<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Show and Hide Element</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 80px;
        }

        h1 {
            color: #333;
        }

        #message {
            font-size: 24px;
            margin: 30px;
        }

        button {
            padding: 12px 20px;
            font-size: 18px;
            margin: 5px;
            cursor: pointer;
        }

        a {
            display: inline-block;
            margin: 20px 10px;
            padding: 10px 15px;
            text-decoration: none;
            background-color: #333;
            color: white;
            border-radius: 5px;
        }
    </style>
</head>

<body>

    <h1>DOM & Event-Based Experiment 4</h1>

    <p id="message">This is the HTML element that can be shown or hidden.</p>

    <button onclick="showElement()">Show</button>
    <button onclick="hideElement()">Hide</button>

    <br>

    <a href="../index.html">← Back to JavaScript Programs</a>
    <a href="../../index.html">← Home</a>

    <script>
        function showElement() {
            document.getElementById("message").style.display = "block";
        }

        function hideElement() {
            document.getElementById("message").style.display = "none";
        }
    </script>

</body>

</html>

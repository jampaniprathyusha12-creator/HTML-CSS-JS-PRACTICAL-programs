<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Counter Application</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 70px;
        }

        #count {
            font-size: 50px;
            margin: 30px;
        }

        button {
            padding: 12px 25px;
            margin: 10px;
            font-size: 18px;
            cursor: pointer;
        }

        a {
            display: inline-block;
            margin: 20px 10px;
            padding: 10px 15px;
            text-decoration: none;
            background-color: #333;
            color: white;
            border-radius: 5px;
        }
    </style>
</head>

<body>

    <h1>DOM & Event-Based Experiment 13</h1>

    <h2>Counter Application</h2>

    <div id="count">0</div>

    <button onclick="decrement()">− Decrement</button>
    <button onclick="increment()">+ Increment</button>

    <br>

    <a href="../index.html">← Back to JavaScript Programs</a>
    <a href="../../index.html">← Home</a>

    <script>
        let count = 0;

        function increment() {
            count++;
            document.getElementById("count").innerHTML = count;
        }

        function decrement() {
            count--;
            document.getElementById("count").innerHTML = count;
        }
    </script>

</body>

</html>

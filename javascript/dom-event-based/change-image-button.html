<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Change Image Using JavaScript</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }

        h1 {
            color: #333;
        }

        img {
            width: 300px;
            height: 200px;
            object-fit: cover;
            margin: 20px;
            border-radius: 10px;
        }

        button {
            padding: 12px 20px;
            font-size: 18px;
            cursor: pointer;
        }

        a {
            display: inline-block;
            margin: 20px 10px;
            padding: 10px 15px;
            text-decoration: none;
            background-color: #333;
            color: white;
            border-radius: 5px;
        }
    </style>
</head>

<body>

    <h1>DOM & Event-Based Experiment 5</h1>

    <img id="myImage" src="../../assets/images/flowers.jpg" alt="Sample Image">

    <br>

    <button onclick="changeImage()">Change Image</button>

    <br>

    <a href="../index.html">← Back to JavaScript Programs</a>
    <a href="../../index.html">← Home</a>

    <script>
        function changeImage() {
            document.getElementById("myImage").src =
                "../../assets/images/sunset.jpg";
        }
    </script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Validate User Details</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 40px;
        }

        form {
            width: 320px;
            margin: auto;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            box-sizing: border-box;
        }

        button {
            padding: 10px 25px;
            margin-top: 10px;
            cursor: pointer;
        }

        #message {
            margin-top: 20px;
            font-weight: bold;
        }

        a {
            display: inline-block;
            margin: 20px 10px;
            padding: 10px 15px;
            text-decoration: none;
            background-color: #333;
            color: white;
            border-radius: 5px;
        }
    </style>
</head>

<body>

    <h1>DOM & Event-Based Experiment 10</h1>

    <h2>User Details Validation</h2>

    <form onsubmit="return validateDetails()">

        <input type="text" id="name" placeholder="Enter your name">

        <input type="text" id="email" placeholder="Enter your email">

        <input type="text" id="phone" placeholder="Enter 10-digit phone number">

        <input type="password" id="password" placeholder="Enter password">

        <button type="submit">Validate</button>

    </form>

    <div id="message"></div>

    <a href="../index.html">← Back to JavaScript Programs</a>
    <a href="../../index.html">← Home</a>

    <script>
        function validateDetails() {

            let name = document.getElementById("name").value.trim();
            let email = document.getElementById("email").value.trim();
            let phone = document.getElementById("phone").value.trim();
            let password = document.getElementById("password").value;

            let message = document.getElementById("message");

            let emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            let phonePattern = /^[0-9]{10}$/;

            if (name === "") {
                message.innerHTML = "Please enter your name.";
                return false;
            }

            if (!emailPattern.test(email)) {
                message.innerHTML = "Please enter a valid email address.";
                return false;
            }

            if (!phonePattern.test(phone)) {
                message.innerHTML = "Phone number must contain exactly 10 digits.";
                return false;
            }

            if (password.length < 6) {
                message.innerHTML = "Password must contain at least 6 characters.";
                return false;
            }

            message.innerHTML = "All details are valid!";
            return false;
        }
    </script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Number Guessing Game</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 70px;
        }

        h1 {
            color: #333;
        }

        input {
            padding: 10px;
            font-size: 18px;
            width: 200px;
        }

        button {
            padding: 10px 20px;
            font-size: 18px;
            margin: 15px;
            cursor: pointer;
        }

        #message {
            font-size: 22px;
            font-weight: bold;
            margin: 20px;
        }

        a {
            display: inline-block;
            margin: 20px 10px;
            padding: 10px 15px;
            text-decoration: none;
            background-color: #333;
            color: white;
            border-radius: 5px;
        }
    </style>
</head>

<body>

    <h1>DOM & Event-Based Experiment 8</h1>

    <p>Guess a number between 1 and 10.</p>

    <input type="number" id="guess" min="1" max="10" placeholder="Enter your guess">

    <br>

    <button onclick="checkGuess()">Check Guess</button>

    <div id="message"></div>

    <a href="../index.html">← Back to JavaScript Programs</a>
    <a href="../../index.html">← Home</a>

    <script>
        let randomNumber = Math.floor(Math.random() * 10) + 1;

        function checkGuess() {
            let guess = Number(document.getElementById("guess").value);
            let message = document.getElementById("message");

            if (guess < 1 || guess > 10) {
                message.innerHTML = "Please enter a number between 1 and 10.";
            } else if (guess === randomNumber) {
                message.innerHTML = "Correct! You guessed the number.";
            } else if (guess < randomNumber) {
                message.innerHTML = "Try a higher number.";
            } else {
                message.innerHTML = "Try a lower number.";
            }
        }
    </script>

</body>

</html>

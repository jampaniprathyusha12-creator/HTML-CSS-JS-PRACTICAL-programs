<!DOCTYPE html>
<html>

<head>
    <title>Keyup Event</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 50px;
        }

        input {
            width: 300px;
            padding: 12px;
            font-size: 18px;
        }

        #message {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>Keyup Event Demonstration</h1>

    <input type="text" placeholder="Type something..." onkeyup="keyUp(event)">

    <p id="message">Release a keyboard key inside the input box.</p>

    <br>

    <a href="../index.html">← Back to JavaScript Programs</a>
    <br><br>
    <a href="../../index.html">← Home</a>

    <script>

        function keyUp(event) {

            document.getElementById("message").textContent =
                "Key released: " + event.key;
        }

    </script>

</body>

</html>

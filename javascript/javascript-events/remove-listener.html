<!DOCTYPE html>
<html>

<head>
    <title>Remove Event Listener</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 50px;
        }

        button {
            padding: 12px 20px;
            margin: 10px;
            font-size: 16px;
            cursor: pointer;
        }

        #message {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>removeEventListener() Demonstration</h1>

    <button id="myButton">Click Me</button>

    <button id="removeButton">Remove Event</button>

    <p id="message">Click the first button.</p>

    <br>

    <a href="../index.html">← Back to JavaScript Programs</a>
    <br><br>
    <a href="../../index.html">← Home</a>

    <script>

        const button = document.getElementById("myButton");
        const removeButton = document.getElementById("removeButton");
        const message = document.getElementById("message");

        // Event handler function
        function showMessage() {
            message.textContent = "Button clicked!";
        }

        // Add event listener
        button.addEventListener("click", showMessage);

        // Remove event listener
        removeButton.addEventListener("click", function () {

            button.removeEventListener("click", showMessage);

            message.textContent =
                "Click event listener has been removed.";
        });

    </script>

</body>

</html>

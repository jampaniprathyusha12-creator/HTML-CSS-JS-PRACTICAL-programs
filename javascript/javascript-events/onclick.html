<!DOCTYPE html>
<html>

<head>
    <title>Onclick Event</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 50px;
        }

        button {
            padding: 12px 20px;
            font-size: 18px;
            cursor: pointer;
        }

        #message {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>Onclick Event Demonstration</h1>

    <button onclick="showMessage()">Click Me</button>

    <p id="message">Click the button to see the message.</p>

    <br>

    <a href="../index.html">← Back to JavaScript Programs</a>
    <br><br>
    <a href="../../index.html">← Home</a>

    <script>

        function showMessage() {
            document.getElementById("message").textContent =
                "Button was clicked!";
        }

    </script>

</body>

</html>

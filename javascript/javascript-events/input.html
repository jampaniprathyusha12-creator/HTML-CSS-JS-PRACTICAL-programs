<!DOCTYPE html>
<html>

<head>
    <title>Input Event</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 50px;
        }

        input {
            width: 300px;
            padding: 12px;
            font-size: 18px;
        }

        #output {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>Input Event Demonstration</h1>

    <input type="text" placeholder="Type something..." oninput="showInput()">

    <p id="output">Your text will appear here.</p>

    <br>

    <a href="../index.html">← Back to JavaScript Programs</a>
    <br><br>
    <a href="../../index.html">← Home</a>

    <script>

        function showInput() {

            const value = document.querySelector("input").value;

            document.getElementById("output").textContent =
                "You typed: " + value;
        }

    </script>

</body>

</html>

<!DOCTYPE html>
<html>

<head>
    <title>Keydown Event</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 50px;
        }

        input {
            width: 300px;
            padding: 12px;
            font-size: 18px;
        }

        #message {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>Keydown Event Demonstration</h1>

    <input type="text" placeholder="Press any key..." onkeydown="keyDown(event)">

    <p id="message">Press a key inside the input box.</p>

    <br>

    <a href="../index.html">← Back to JavaScript Programs</a>
    <br><br>
    <a href="../../index.html">← Home</a>

    <script>

        function keyDown(event) {

            document.getElementById("message").textContent =
                "Key pressed: " + event.key;
        }

    </script>

</body>

</html>

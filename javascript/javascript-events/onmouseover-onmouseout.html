<!DOCTYPE html>
<html>

<head>
    <title>Mouseover and Mouseout Events</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 50px;
        }

        #box {
            width: 300px;
            height: 150px;
            margin: 30px auto;
            border: 2px solid black;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            background-color: lightgray;
        }
    </style>
</head>

<body>

    <h1>Mouseover and Mouseout</h1>

    <div id="box" onmouseover="mouseOver()" onmouseout="mouseOut()">
        Move the mouse over me
    </div>

    <p id="message">Move your mouse over the box.</p>

    <br>

    <a href="../index.html">← Back to JavaScript Programs</a>
    <br><br>
    <a href="../../index.html">← Home</a>

    <script>

        function mouseOver() {
            document.getElementById("box").style.backgroundColor = "lightblue";
            document.getElementById("message").textContent =
                "Mouse is over the box!";
        }

        function mouseOut() {
            document.getElementById("box").style.backgroundColor = "lightgray";
            document.getElementById("message").textContent =
                "Mouse moved out of the box!";
        }

    </script>

</body>

</html>

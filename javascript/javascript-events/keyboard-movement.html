<!DOCTYPE html>
<html>

<head>
    <title>Keyboard Controlled Moving Object</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 30px;
        }

        #gameArea {
            width: 500px;
            height: 300px;
            margin: 30px auto;
            border: 3px solid black;
            position: relative;
            background-color: lightgray;
        }

        #object {
            width: 50px;
            height: 50px;
            background-color: lightblue;
            border: 2px solid black;
            position: absolute;
            left: 220px;
            top: 120px;
        }
    </style>
</head>

<body>

    <h1>Keyboard Controlled Moving Object</h1>

    <p>Use the Arrow Keys to move the box.</p>

    <div id="gameArea">
        <div id="object"></div>
    </div>

    <br>

    <a href="../index.html">← Back to JavaScript Programs</a>
    <br><br>
    <a href="../../index.html">← Home</a>

    <script>

        const object = document.getElementById("object");
        const gameArea = document.getElementById("gameArea");

        let x = 220;
        let y = 120;

        document.addEventListener("keydown", function (event) {

            const step = 10;

            if (event.key === "ArrowUp") {
                y -= step;
            }

            if (event.key === "ArrowDown") {
                y += step;
            }

            if (event.key === "ArrowLeft") {
                x -= step;
            }

            if (event.key === "ArrowRight") {
                x += step;
            }

            // Keep the object inside the game area
            x = Math.max(0, Math.min(x, gameArea.clientWidth - object.offsetWidth));
            y = Math.max(0, Math.min(y, gameArea.clientHeight - object.offsetHeight));

            object.style.left = x + "px";
            object.style.top = y + "px";
        });

    </script>

</body>

</html>

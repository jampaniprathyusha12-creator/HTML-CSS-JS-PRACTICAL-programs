<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reaction Time Game</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 60px;
        }

        #gameBox {
            width: 300px;
            height: 200px;
            margin: 30px auto;
            background-color: lightgray;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            cursor: pointer;
            border-radius: 10px;
        }

        button {
            padding: 12px 25px;
            font-size: 18px;
            cursor: pointer;
        }

        #result {
            font-size: 20px;
            margin: 20px;
        }

        a {
            text-decoration: none;
            color: blue;
        }
    </style>
</head>

<body>

    <h1>Reaction Time Game</h1>

    <button onclick="startGame()">Start Game</button>

    <div id="gameBox">
        Click Start to Begin
    </div>

    <p id="result">Your reaction time will appear here.</p>

    <br>

    <a href="../index.html">← Back to JavaScript Programs</a>
    <br><br>
    <a href="../../index.html">← Home</a>

    <script>
        let startTime;
        let timer;

        function startGame() {
            const gameBox = document.getElementById("gameBox");
            const result = document.getElementById("result");

            result.textContent = "Wait for the box to turn green...";

            gameBox.style.backgroundColor = "lightgray";
            gameBox.textContent = "Wait...";

            const delay = Math.floor(Math.random() * 3000) + 2000;

            clearTimeout(timer);

            timer = setTimeout(function () {
                gameBox.style.backgroundColor = "lightgreen";
                gameBox.textContent = "CLICK NOW!";

                startTime = Date.now();
            }, delay);
        }

        document.getElementById("gameBox").addEventListener("click", function () {
            if (!startTime) {
                return;
            }

            const reactionTime = Date.now() - startTime;

            document.getElementById("result").textContent =
                "Your reaction time: " + reactionTime + " ms";

            startTime = null;
        });
    </script>

</body>

</html>

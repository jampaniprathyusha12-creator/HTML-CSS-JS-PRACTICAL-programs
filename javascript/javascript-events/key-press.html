<!DOCTYPE html>
<html>

<head>
    <title>Display Key Pressed</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 50px;
        }

        #keyDisplay {
            margin: 30px auto;
            padding: 30px;
            width: 300px;
            border: 2px solid black;
            font-size: 30px;
            font-weight: bold;
        }
    </style>
</head>

<body onkeydown="displayKey(event)">

    <h1>Key Pressed Display</h1>

    <p>Press any key on your keyboard.</p>

    <div id="keyDisplay">
        No key pressed
    </div>

    <br>

    <a href="../index.html">← Back to JavaScript Programs</a>
    <br><br>
    <a href="../../index.html">← Home</a>

    <script>

        function displayKey(event) {

            document.getElementById("keyDisplay").textContent =
                "Key: " + event.key;
        }

    </script>

</body>

</html>

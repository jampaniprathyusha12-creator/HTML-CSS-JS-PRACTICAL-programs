<!DOCTYPE html>
<html>

<head>
    <title>Mouse Down and Mouse Up</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 50px;
        }

        #box {
            width: 300px;
            height: 150px;
            margin: 30px auto;
            border: 2px solid black;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            background-color: lightgray;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>Mouse Down and Mouse Up</h1>

    <div id="box" onmousedown="mouseDown()" onmouseup="mouseUp()">
        Press and Release the Mouse
    </div>

    <p id="message">Press the mouse button on the box.</p>

    <br>

    <a href="../index.html">← Back to JavaScript Programs</a>
    <br><br>
    <a href="../../index.html">← Home</a>

    <script>

        function mouseDown() {
            document.getElementById("box").style.backgroundColor = "lightblue";
            document.getElementById("message").textContent =
                "Mouse button is pressed!";
        }

        function mouseUp() {
            document.getElementById("box").style.backgroundColor = "lightgreen";
            document.getElementById("message").textContent =
                "Mouse button is released!";
        }

    </script>

</body>

</html>

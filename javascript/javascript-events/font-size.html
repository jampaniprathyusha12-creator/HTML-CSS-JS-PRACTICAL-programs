<!DOCTYPE html>
<html>

<head>
    <title>Dynamic Font Size</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 50px;
        }

        #text {
            font-size: 20px;
            margin: 30px;
        }

        button {
            padding: 10px 18px;
            margin: 5px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>Dynamic Font Size</h1>

    <p id="text">
        This text changes its font size dynamically.
    </p>

    <button onclick="increaseFont()">Increase Font</button>
    <button onclick="decreaseFont()">Decrease Font</button>
    <button onclick="resetFont()">Reset</button>

    <script>

        let fontSize = 20;

        function increaseFont() {
            fontSize += 2;
            document.getElementById("text").style.fontSize =
                fontSize + "px";
        }

        function decreaseFont() {
            if (fontSize > 10) {
                fontSize -= 2;
                document.getElementById("text").style.fontSize =
                    fontSize + "px";
            }
        }

        function resetFont() {
            fontSize = 20;
            document.getElementById("text").style.fontSize =
                fontSize + "px";
        }

    </script>

</body>

</html>

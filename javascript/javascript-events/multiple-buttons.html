<!DOCTYPE html>
<html>

<head>
    <title>Multiple Buttons with Events</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 50px;
        }

        button {
            padding: 12px 20px;
            margin: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        #message {
            margin-top: 25px;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>Multiple Buttons with Different Events</h1>

    <button onclick="showMessage()">
        Click Button
    </button>

    <button ondblclick="doubleClickMessage()">
        Double Click Button
    </button>

    <button onmouseover="mouseOverMessage()" onmouseout="mouseOutMessage()">
        Mouse Over Button
    </button>

    <button onmousedown="mouseDownMessage()" onmouseup="mouseUpMessage()">
        Mouse Press Button
    </button>

    <p id="message">
        Perform an action on any button.
    </p>

    <br>

    <a href="../index.html">← Back to JavaScript Programs</a>
    <br><br>
    <a href="../../index.html">← Home</a>

    <script>

        function showMessage() {
            document.getElementById("message").textContent =
                "You clicked the button!";
        }

        function doubleClickMessage() {
            document.getElementById("message").textContent =
                "You double-clicked the button!";
        }

        function mouseOverMessage() {
            document.getElementById("message").textContent =
                "Mouse is over the button!";
        }

        function mouseOutMessage() {
            document.getElementById("message").textContent =
                "Mouse moved out of the button!";
        }

        function mouseDownMessage() {
            document.getElementById("message").textContent =
                "Mouse button is pressed!";
        }

        function mouseUpMessage() {
            document.getElementById("message").textContent =
                "Mouse button is released!";
        }

    </script>

</body>

</html>

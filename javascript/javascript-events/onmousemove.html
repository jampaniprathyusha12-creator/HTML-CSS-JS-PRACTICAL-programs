<!DOCTYPE html>
<html>

<head>
    <title>Mousemove Event</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 50px;
        }

        #box {
            width: 500px;
            height: 250px;
            margin: 30px auto;
            border: 2px solid black;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: lightgray;
            font-size: 20px;
        }

        #coordinates {
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>Mousemove Event Demonstration</h1>

    <div id="box" onmousemove="trackMouse(event)">
        Move your mouse inside this box
    </div>

    <p id="coordinates">X: 0 | Y: 0</p>

    <br>

    <a href="../index.html">← Back to JavaScript Programs</a>
    <br><br>
    <a href="../../index.html">← Home</a>

    <script>

        function trackMouse(event) {

            document.getElementById("coordinates").textContent =
                "X: " + event.offsetX +
                " | Y: " + event.offsetY;
        }

    </script>

</body>

</html>

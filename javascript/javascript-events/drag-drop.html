<!DOCTYPE html>
<html>

<head>
    <title>Drag and Drop</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 40px;
        }

        #dragItem {
            width: 120px;
            padding: 20px;
            margin: 30px auto;
            background-color: lightblue;
            border: 2px solid black;
            cursor: grab;
        }

        #dropArea {
            width: 350px;
            height: 180px;
            margin: 30px auto;
            border: 3px dashed black;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        #message {
            font-weight: bold;
            font-size: 18px;
        }
    </style>
</head>

<body>

    <h1>Drag and Drop Application</h1>

    <div id="dragItem" draggable="true">
        Drag Me
    </div>

    <div id="dropArea">
        Drop Here
    </div>

    <p id="message">Drag the box into the drop area.</p>

    <br>

    <a href="../index.html">← Back to JavaScript Programs</a>
    <br><br>
    <a href="../../index.html">← Home</a>

    <script>

        const dragItem = document.getElementById("dragItem");
        const dropArea = document.getElementById("dropArea");
        const message = document.getElementById("message");

        // When dragging starts
        dragItem.addEventListener("dragstart", function (event) {
            event.dataTransfer.setData("text", "dragItem");
            message.textContent = "Item is being dragged.";
        });

        // Allow dropping
        dropArea.addEventListener("dragover", function (event) {
            event.preventDefault();
        });

        // When item is dropped
        dropArea.addEventListener("drop", function (event) {

            event.preventDefault();

            const data = event.dataTransfer.getData("text");

            if (data === "dragItem") {
                dropArea.appendChild(dragItem);
                message.textContent =
                    "Item dropped successfully!";
            }
        });

    </script>

</body>

</html>

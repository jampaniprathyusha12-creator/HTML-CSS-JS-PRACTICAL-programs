<!DOCTYPE html>
<html>

<head>
    <title>College Admission Form</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            padding: 30px;
        }

        .container {
            width: 450px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        h2 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 12px;
        }

        input,
        select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            margin-top: 20px;
            background-color: #333;
            color: white;
            border: none;
            cursor: pointer;
        }

        .error {
            color: red;
            font-size: 14px;
        }

        #success {
            color: green;
            text-align: center;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>College Admission Form</h2>

        <form id="admissionForm">

            <label>Student Name:</label>
            <input type="text" id="name">
            <span class="error" id="nameError"></span>

            <label>Email:</label>
            <input type="text" id="email">
            <span class="error" id="emailError"></span>

            <label>Phone Number:</label>
            <input type="text" id="phone">
            <span class="error" id="phoneError"></span>

            <label>Date of Birth:</label>
            <input type="date" id="dob">
            <span class="error" id="dobError"></span>

            <label>Course:</label>
            <select id="course">
                <option value="">Select Course</option>
                <option value="B.Tech">B.Tech</option>
                <option value="B.Sc">B.Sc</option>
                <option value="B.Com">B.Com</option>
                <option value="BBA">BBA</option>
            </select>
            <span class="error" id="courseError"></span>

            <label>Percentage:</label>
            <input type="number" id="percentage" min="0" max="100">
            <span class="error" id="percentageError"></span>

            <button type="submit">Apply for Admission</button>

            <p id="success"></p>

        </form>

        <br>

        <a href="../index.html">← Back to JavaScript Programs</a>
        <br><br>
        <a href="../../index.html">← Home</a>

    </div>

    <script>
        document.getElementById("admissionForm").addEventListener("submit", function (event) {

            event.preventDefault();

            let name = document.getElementById("name").value.trim();
            let email = document.getElementById("email").value.trim();
            let phone = document.getElementById("phone").value.trim();
            let dob = document.getElementById("dob").value;
            let course = document.getElementById("course").value;
            let percentage = document.getElementById("percentage").value;

            let valid = true;

            document.querySelectorAll(".error").forEach(function (error) {
                error.textContent = "";
            });

            document.getElementById("success").textContent = "";

            if (name === "") {
                document.getElementById("nameError").textContent =
                    "Name is required";
                valid = false;
            }

            let emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            if (email === "") {
                document.getElementById("emailError").textContent =
                    "Email is required";
                valid = false;
            }
            else if (!emailPattern.test(email)) {
                document.getElementById("emailError").textContent =
                    "Enter a valid email";
                valid = false;
            }

            let phonePattern = /^[0-9]{10}$/;

            if (phone === "") {
                document.getElementById("phoneError").textContent =
                    "Phone number is required";
                valid = false;
            }
            else if (!phonePattern.test(phone)) {
                document.getElementById("phoneError").textContent =
                    "Enter a valid 10-digit phone number";
                valid = false;
            }

            if (dob === "") {
                document.getElementById("dobError").textContent =
                    "Date of birth is required";
                valid = false;
            }

            if (course === "") {
                document.getElementById("courseError").textContent =
                    "Please select a course";
                valid = false;
            }

            if (percentage === "") {
                document.getElementById("percentageError").textContent =
                    "Percentage is required";
                valid = false;
            }
            else if (percentage < 0 || percentage > 100) {
                document.getElementById("percentageError").textContent =
                    "Percentage must be between 0 and 100";
                valid = false;
            }

            if (valid) {
                document.getElementById("success").textContent =
                    "Admission form submitted successfully!";

                document.getElementById("admissionForm").reset();
            }
        });
    </script>

</body>

</html>

<!DOCTYPE html>
<html>

<head>
    <title>LCM of Two Numbers</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }

        input {
            padding: 10px;
            margin: 5px;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
        }

        #output {
            margin-top: 20px;
            font-size: 18px;
        }
    </style>
</head>

<body>

    <h2>LCM of Two Numbers</h2>

    <input type="number" id="num1" placeholder="Enter first number">
    <br>

    <input type="number" id="num2" placeholder="Enter second number">
    <br><br>

    <button onclick="findLCM()">Find LCM</button>

    <div id="output"></div>

    <br>
    <a href="../index.html">← Back to JavaScript Programs</a>
    <br><br>
    <a href="../../index.html">← Home</a>

    <script>
        function findLCM() {
            let num1 = Number(document.getElementById("num1").value);
            let num2 = Number(document.getElementById("num2").value);

            let a = Math.abs(num1);
            let b = Math.abs(num2);

            let x = a;
            let y = b;

            while (y !== 0) {
                let remainder = x % y;
                x = y;
                y = remainder;
            }

            let gcd = x;
            let lcm = Math.abs((num1 * num2) / gcd);

            document.getElementById("output").innerHTML =
                "LCM = " + lcm;
        }
    </script>

</body>

</html>

<!DOCTYPE html>
<html>

<head>
    <title>Remove Duplicate Elements</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }

        input {
            padding: 10px;
            width: 300px;
            margin: 10px;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
        }

        #output {
            margin-top: 20px;
            font-size: 18px;
        }
    </style>
</head>

<body>

    <h2>Remove Duplicate Elements from Array</h2>

    <input type="text" id="arrayInput" placeholder="Enter numbers separated by commas">
    <br>

    <button onclick="removeDuplicates()">Remove Duplicates</button>

    <div id="output"></div>

    <br>
    <a href="../index.html">← Back to JavaScript Programs</a>
    <br><br>
    <a href="../../index.html">← Home</a>

    <script>
        function removeDuplicates() {
            let input = document.getElementById("arrayInput").value;

            let arr = input.split(",").map(Number);

            let uniqueArray = [...new Set(arr)];

            document.getElementById("output").innerHTML =
                "Array after removing duplicates: " +
                uniqueArray.join(", ");
        }
    </script>

</body>

</html>

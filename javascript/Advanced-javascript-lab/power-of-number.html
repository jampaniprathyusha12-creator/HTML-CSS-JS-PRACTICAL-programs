<!DOCTYPE html>
<html>

<head>
    <title>Power of a Number</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }

        input {
            padding: 10px;
            margin: 5px;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
        }

        #output {
            margin-top: 20px;
            font-size: 18px;
        }
    </style>
</head>

<body>

    <h2>Power of a Number</h2>

    <input type="number" id="base" placeholder="Enter base">
    <br>

    <input type="number" id="exponent" placeholder="Enter exponent">
    <br><br>

    <button onclick="calculatePower()">Calculate Power</button>

    <div id="output"></div>

    <br>
    <a href="../index.html">← Back to JavaScript Programs</a>
    <br><br>
    <a href="../../index.html">← Home</a>

    <script>
        function calculatePower() {
            let base = Number(document.getElementById("base").value);
            let exponent = Number(document.getElementById("exponent").value);

            let result = Math.pow(base, exponent);

            document.getElementById("output").innerHTML =
                base + " raised to the power " + exponent + " = " + result;
        }
    </script>

</body>

</html>

<!DOCTYPE html>
<html>

<head>
    <title>GCD of Two Numbers</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }

        input {
            padding: 10px;
            margin: 5px;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
        }

        #output {
            margin-top: 20px;
            font-size: 18px;
        }
    </style>
</head>

<body>

    <h2>GCD of Two Numbers</h2>

    <input type="number" id="num1" placeholder="Enter first number">
    <br>

    <input type="number" id="num2" placeholder="Enter second number">
    <br><br>

    <button onclick="findGCD()">Find GCD</button>

    <div id="output"></div>

    <br>
    <a href="../index.html">← Back to JavaScript Programs</a>
    <br><br>
    <a href="../../index.html">← Home</a>

    <script>
        function findGCD() {
            let a = Number(document.getElementById("num1").value);
            let b = Number(document.getElementById("num2").value);

            while (b !== 0) {
                let remainder = a % b;
                a = b;
                b = remainder;
            }

            document.getElementById("output").innerHTML =
                "GCD = " + Math.abs(a);
        }
    </script>

</body>

</html>

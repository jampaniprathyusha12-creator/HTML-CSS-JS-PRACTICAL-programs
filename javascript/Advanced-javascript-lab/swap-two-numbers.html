<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swap Two Numbers</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }

        input {
            padding: 10px;
            margin: 8px;
            width: 200px;
        }

        button {
            padding: 10px 20px;
            margin: 15px;
            cursor: pointer;
        }

        #output {
            margin: 20px auto;
            padding: 20px;
            width: 400px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 18px;
        }

        a {
            display: inline-block;
            margin: 20px 10px;
            padding: 10px 15px;
            text-decoration: none;
            background-color: #333;
            color: white;
            border-radius: 5px;
        }
    </style>
</head>

<body>

    <h1>JavaScript Question 46</h1>

    <h2>Swap Two Numbers</h2>

    <input type="number" id="num1" placeholder="Enter first number">
    <br>

    <input type="number" id="num2" placeholder="Enter second number">
    <br>

    <button onclick="swapNumbers()">Swap Numbers</button>

    <div id="output"></div>

    <a href="../index.html">← Back to JavaScript Programs</a>
    <a href="../../index.html">← Home</a>

    <script>
        function swapNumbers() {

            let num1 = Number(document.getElementById("num1").value);
            let num2 = Number(document.getElementById("num2").value);

            let temp = num1;
            num1 = num2;
            num2 = temp;

            document.getElementById("output").innerHTML = `
                After Swapping:<br>
                First Number = ${num1}<br>
                Second Number = ${num2}
            `;
        }
    </script>

</body>

</html>

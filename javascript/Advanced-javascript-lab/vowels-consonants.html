<!DOCTYPE html>
<html>

<head>
    <title>Count Vowels and Consonants</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }

        input {
            padding: 10px;
            width: 300px;
            margin: 10px;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
        }

        #output {
            margin-top: 20px;
            font-size: 18px;
            line-height: 1.8;
        }
    </style>
</head>

<body>

    <h2>Count Vowels and Consonants</h2>

    <input type="text" id="text" placeholder="Enter a string">
    <br>

    <button onclick="countVowelsConsonants()">
        Count
    </button>

    <div id="output"></div>

    <br>
    <a href="../index.html">← Back to JavaScript Programs</a>
    <br><br>
    <a href="../../index.html">← Home</a>

    <script>
        function countVowelsConsonants() {
            let text = document.getElementById("text").value;
            let vowels = 0;
            let consonants = 0;

            for (let char of text.toLowerCase()) {
                if (/[a-z]/.test(char)) {
                    if ("aeiou".includes(char)) {
                        vowels++;
                    } else {
                        consonants++;
                    }
                }
            }

            document.getElementById("output").innerHTML =
                "Vowels = " + vowels + "<br>" +
                "Consonants = " + consonants;
        }
    </script>

</body>

</html>

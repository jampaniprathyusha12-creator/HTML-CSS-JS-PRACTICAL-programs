<!DOCTYPE html>
<html>

<head>
    <title>Frequency of Characters</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }

        input {
            padding: 10px;
            width: 300px;
            margin: 10px;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
        }

        #output {
            margin-top: 20px;
            font-size: 18px;
            line-height: 1.8;
        }
    </style>
</head>

<body>

    <h2>Frequency of Characters in a String</h2>

    <input type="text" id="text" placeholder="Enter a string">
    <br>

    <button onclick="findFrequency()">Find Frequency</button>

    <div id="output"></div>

    <br>
    <a href="../index.html">← Back to JavaScript Programs</a>
    <br><br>
    <a href="../../index.html">← Home</a>

    <script>
        function findFrequency() {
            let text = document.getElementById("text").value;
            let frequency = {};

            for (let char of text) {
                if (char === " ") {
                    continue;
                }

                if (frequency[char]) {
                    frequency[char]++;
                } else {
                    frequency[char] = 1;
                }
            }

            let result = "";

            for (let char in frequency) {
                result += char + " : " + frequency[char] + "<br>";
            }

            document.getElementById("output").innerHTML = result;
        }
    </script>

</body>

</html>

<!DOCTYPE html>
<html>

<head>
    <title>Merge Two Arrays</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }

        input {
            padding: 10px;
            width: 300px;
            margin: 10px;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
        }

        #output {
            margin-top: 20px;
            font-size: 18px;
        }
    </style>
</head>

<body>

    <h2>Merge Two Arrays</h2>

    <input type="text" id="array1" placeholder="Enter first array">
    <br>

    <input type="text" id="array2" placeholder="Enter second array">
    <br>

    <button onclick="mergeArrays()">Merge Arrays</button>

    <div id="output"></div>

    <br>
    <a href="../index.html">← Back to JavaScript Programs</a>
    <br><br>
    <a href="../../index.html">← Home</a>

    <script>
        function mergeArrays() {
            let arr1 = document.getElementById("array1").value
                .split(",").map(Number);

            let arr2 = document.getElementById("array2").value
                .split(",").map(Number);

            let mergedArray = arr1.concat(arr2);

            document.getElementById("output").innerHTML =
                "Merged Array = " + mergedArray.join(", ");
        }
    </script>

</body>

</html>

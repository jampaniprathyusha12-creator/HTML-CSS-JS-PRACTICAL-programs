<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Interactive Webpage</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            text-align: center;
            background-color: #f5f5f5;
        }

        header {
            padding: 30px;
            background-color: #333;
            color: white;
        }

        .container {
            max-width: 700px;
            margin: 40px auto;
            padding: 25px;
            background-color: white;
            border-radius: 10px;
        }

        button {
            padding: 12px 20px;
            margin: 10px;
            cursor: pointer;
            font-size: 16px;
        }

        #counter {
            font-size: 40px;
            margin: 20px;
        }

        #message {
            font-size: 20px;
            margin: 20px;
        }

        a {
            display: inline-block;
            margin: 20px 10px;
            padding: 10px 15px;
            text-decoration: none;
            background-color: #333;
            color: white;
            border-radius: 5px;
        }

        @media (max-width: 600px) {
            .container {
                width: 90%;
            }

            h1 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Interactive Webpage</h1>
        <p>HTML, CSS and JavaScript</p>
    </header>

    <div class="container">

        <h2>Welcome!</h2>

        <p id="message">
            Click the button to interact with the webpage.
        </p>

        <button onclick="changeMessage()">
            Change Message
        </button>

        <h2>Counter</h2>

        <div id="counter">0</div>

        <button onclick="increaseCounter()">
            Increase
        </button>

        <button onclick="decreaseCounter()">
            Decrease
        </button>

        <button onclick="resetCounter()">
            Reset
        </button>

        <br>

        <button onclick="changeBackground()">
            Change Background
        </button>

    </div>

    <a href="../index.html">← Back to JavaScript Programs</a>
    <a href="../../index.html">← Home</a>

    <script>
        let count = 0;

        function changeMessage() {

            document.getElementById("message").innerHTML =
                "The webpage is now interactive using JavaScript!";
        }

        function increaseCounter() {

            count++;

            document.getElementById("counter").innerHTML =
                count;
        }

        function decreaseCounter() {

            count--;

            document.getElementById("counter").innerHTML =
                count;
        }

        function resetCounter() {

            count = 0;

            document.getElementById("counter").innerHTML =
                count;
        }

        function changeBackground() {

            document.body.style.backgroundColor =
                "lightblue";
        }
    </script>

</body>

</html>

<!DOCTYPE html>
<html>

<head>
    <title>BMI Calculator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            text-align: center;
            padding: 40px;
        }

        .container {
            width: 450px;
            margin: auto;
            background-color: white;
            padding: 30px;
            border-radius: 15px;
        }

        input {
            display: block;
            width: 80%;
            padding: 12px;
            margin: 15px auto;
            font-size: 16px;
        }

        button {
            padding: 10px 20px;
            margin: 10px;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>BMI Calculator</h2>

        <input type="number" id="weight" placeholder="Weight in kg">

        <input type="number" id="height" placeholder="Height in meters">

        <button onclick="calculateBMI()">Calculate BMI</button>
        <button onclick="resetForm()">Reset</button>

        <div id="result"></div>

        <br>

        <a href="../index.html">← Back to JavaScript Programs</a>
        <br><br>
        <a href="../../index.html">← Home</a>

    </div>

    <script>

        function calculateBMI() {

            let weight = Number(document.getElementById("weight").value);
            let height = Number(document.getElementById("height").value);

            if (weight <= 0 || height <= 0) {
                document.getElementById("result").textContent =
                    "Please enter valid weight and height.";
                return;
            }

            let bmi = weight / (height * height);

            let category;

            if (bmi < 18.5) {
                category = "Below the standard range";
            } else if (bmi < 25) {
                category = "Standard range";
            } else if (bmi < 30) {
                category = "Above the standard range";
            } else {
                category = "High BMI range";
            }

            document.getElementById("result").innerHTML =
                "BMI: " + bmi.toFixed(2) +
                "<br>Category: " + category;
        }

        function resetForm() {

            document.getElementById("weight").value = "";
            document.getElementById("height").value = "";
            document.getElementById("result").textContent = "";
        }

    </script>

</body>

</html>

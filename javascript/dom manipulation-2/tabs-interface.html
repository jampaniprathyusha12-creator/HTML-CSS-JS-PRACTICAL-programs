<!DOCTYPE html>
<html>

<head>
    <title>Tabs Interface</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 40px;
        }

        .tabs {
            margin: 20px;
        }

        .tab-button {
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
            border: 1px solid #333;
        }

        .tab-content {
            display: none;
            width: 60%;
            margin: 20px auto;
            padding: 20px;
            border: 1px solid #333;
            border-radius: 10px;
        }

        .active {
            display: block;
        }
    </style>
</head>

<body>

    <h1>Tabs Interface</h1>

    <div class="tabs">
        <button class="tab-button" onclick="showTab('htmlTab')">
            HTML
        </button>

        <button class="tab-button" onclick="showTab('cssTab')">
            CSS
        </button>

        <button class="tab-button" onclick="showTab('jsTab')">
            JavaScript
        </button>
    </div>

    <div id="htmlTab" class="tab-content">
        <h2>HTML</h2>
        <p>HTML is used to create the structure of a webpage.</p>
    </div>

    <div id="cssTab" class="tab-content">
        <h2>CSS</h2>
        <p>CSS is used to style and design a webpage.</p>
    </div>

    <div id="jsTab" class="tab-content">
        <h2>JavaScript</h2>
        <p>JavaScript is used to add interactivity to a webpage.</p>
    </div>

    <br>

    <a href="../index.html">← Back to JavaScript Programs</a>
    <br><br>
    <a href="../../index.html">← Home</a>

    <script>
        function showTab(tabId) {

            const contents =
                document.querySelectorAll(".tab-content");

            contents.forEach(function (content) {
                content.classList.remove("active");
            });

            document.getElementById(tabId)
                .classList.add("active");
        }

        showTab("htmlTab");
    </script>

</body>

</html>

<!DOCTYPE html>
<html>

<head>
    <title>Replace HTML Element</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
            background-color: #f2f2f2;
        }

        .container {
            background-color: white;
            width: 500px;
            margin: auto;
            padding: 30px;
            border-radius: 15px;
        }

        #oldElement {
            background-color: lightblue;
            padding: 20px;
            border-radius: 10px;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>Replace HTML Element</h2>

        <p id="oldElement">
            This is the original paragraph.
        </p>

        <button onclick="replaceElement()">
            Replace Element
        </button>

        <br><br>

        <a href="../index.html">← Back to JavaScript Programs</a>
        <br><br>
        <a href="../../index.html">← Home</a>

    </div>

    <script>

        function replaceElement() {

            let oldElement =
                document.getElementById("oldElement");

            let newElement =
                document.createElement("h3");

            newElement.textContent =
                "This is the new heading.";

            newElement.style.backgroundColor = "lightgreen";
            newElement.style.padding = "20px";
            newElement.style.borderRadius = "10px";

            oldElement.parentNode.replaceChild(
                newElement,
                oldElement
            );
        }

    </script>

</body>

</html>

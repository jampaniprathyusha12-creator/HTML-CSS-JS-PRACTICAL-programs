<!DOCTYPE html>
<html>

<head>
    <title>Add Options Dynamically</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 40px;
        }

        select {
            padding: 10px;
            width: 250px;
            font-size: 16px;
        }

        input {
            padding: 10px;
            width: 220px;
        }

        button {
            padding: 10px 20px;
            margin: 10px;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            font-size: 18px;
        }
    </style>
</head>

<body>

    <h1>Add Options Dynamically</h1>

    <input type="text" id="optionInput" placeholder="Enter an option">

    <button onclick="addOption()">Add Option</button>

    <br><br>

    <select id="mySelect" onchange="showSelected()">
        <option value="">Select an option</option>
    </select>

    <p id="result"></p>

    <br>

    <a href="../index.html">← Back to JavaScript Programs</a>
    <br><br>
    <a href="../../index.html">← Home</a>

    <script>
        function addOption() {

            const input = document.getElementById("optionInput");
            const value = input.value.trim();

            if (value === "") {
                alert("Please enter an option.");
                return;
            }

            const option = document.createElement("option");

            option.value = value;
            option.textContent = value;

            document.getElementById("mySelect").appendChild(option);

            input.value = "";
            input.focus();
        }

        function showSelected() {

            const selected =
                document.getElementById("mySelect").value;

            if (selected === "") {
                document.getElementById("result").textContent = "";
            } else {
                document.getElementById("result").textContent =
                    "Selected option: " + selected;
            }
        }
    </script>

</body>

</html>

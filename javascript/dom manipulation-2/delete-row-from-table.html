<!DOCTYPE html>
<html>

<head>
    <title>Delete Selected Table Row</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 40px;
        }

        table {
            margin: 20px auto;
            border-collapse: collapse;
            width: 70%;
        }

        th,
        td {
            border: 1px solid #333;
            padding: 12px;
        }

        th {
            background-color: #ddd;
        }

        button {
            padding: 8px 15px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>Delete Selected Table Row</h1>

    <table id="studentTable">
        <tr>
            <th>Name</th>
            <th>Age</th>
            <th>Course</th>
            <th>Action</th>
        </tr>

        <tr>
            <td>Prathyusha</td>
            <td>19</td>
            <td>B.Tech</td>
            <td>
                <button onclick="deleteRow(this)">Delete</button>
            </td>
        </tr>

        <tr>
            <td>priya</td>
            <td>20</td>
            <td>B.Tech</td>
            <td>
                <button onclick="deleteRow(this)">Delete</button>
            </td>
        </tr>

        <tr>
            <td>manvi</td>
            <td>19</td>
            <td>B.Sc</td>
            <td>
                <button onclick="deleteRow(this)">Delete</button>
            </td>
        </tr>

        <tr>
            <td>mahi</td>
            <td>21</td>
            <td>BCA</td>
            <td>
                <button onclick="deleteRow(this)">Delete</button>
            </td>
        </tr>
    </table>

    <br>

    <a href="../index.html">← Back to JavaScript Programs</a>
    <br><br>
    <a href="../../index.html">← Home</a>

    <script>
        function deleteRow(button) {

            const row = button.parentNode.parentNode;

            row.remove();
        }
    </script>

</body>

</html>

<!DOCTYPE html>
<html>

<head>
    <title>Dynamic Unordered List</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 40px;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
        }

        ul {
            display: inline-block;
            text-align: left;
            margin-top: 20px;
        }

        li {
            margin: 8px;
            font-size: 18px;
        }
    </style>
</head>

<body>

    <h1>Dynamic Unordered List</h1>

    <button onclick="createList()">Create List</button>

    <div id="listContainer"></div>

    <br><br>
    <a href="../index.html">← Back to JavaScript Programs</a>
    <br><br>
    <a href="../../index.html">← Home</a>

    <script>
        function createList() {

            const subjects = ["HTML", "CSS", "JavaScript", "Python"];

            const ul = document.createElement("ul");

            subjects.forEach(function (subject) {

                const li = document.createElement("li");

                li.textContent = subject;

                ul.appendChild(li);
            });

            document.getElementById("listContainer").innerHTML = "";

            document.getElementById("listContainer").appendChild(ul);
        }
    </script>

</body>

</html>

<!DOCTYPE html>
<html>

<head>
    <title>Dynamic Student Table</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 40px;
        }

        button {
            padding: 10px 20px;
            margin: 15px;
            cursor: pointer;
        }

        table {
            margin: 20px auto;
            border-collapse: collapse;
            width: 70%;
        }

        th,
        td {
            border: 1px solid #333;
            padding: 12px;
        }

        th {
            background-color: #ddd;
        }
    </style>
</head>

<body>

    <h1>Dynamic Student Table</h1>

    <button onclick="createTable()">Create Student Table</button>

    <div id="tableContainer"></div>

    <br><br>

    <a href="../index.html">← Back to JavaScript Programs</a>
    <br><br>
    <a href="../../index.html">← Home</a>

    <script>
        function createTable() {

            const students = [
                { name: "Prathyusha", age: 19, course: "B.Tech" },
                { name: "priya", age: 20, course: "B.Tech" },
                { name: "manvi", age: 19, course: "B.Sc" },
                { name: "mahi", age: 21, course: "BCA" },
                { name: "surya", age: 22, course: "BBA" }
            ];

            const table = document.createElement("table");

            const headerRow = document.createElement("tr");

            const headers = ["Name", "Age", "Course"];

            headers.forEach(function (header) {
                const th = document.createElement("th");
                th.textContent = header;
                headerRow.appendChild(th);
            });

            table.appendChild(headerRow);

            students.forEach(function (student) {

                const row = document.createElement("tr");

                const nameCell = document.createElement("td");
                nameCell.textContent = student.name;

                const ageCell = document.createElement("td");
                ageCell.textContent = student.age;

                const courseCell = document.createElement("td");
                courseCell.textContent = student.course;

                row.appendChild(nameCell);
                row.appendChild(ageCell);
                row.appendChild(courseCell);

                table.appendChild(row);
            });

            document.getElementById("tableContainer").innerHTML = "";
            document.getElementById("tableContainer").appendChild(table);
        }
    </script>

</body>

</html>

<!DOCTYPE html>
<html>

<head>
    <title>Change Background Color</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
            background-color: #f2f2f2;
        }

        .container {
            background-color: white;
            width: 500px;
            margin: auto;
            padding: 30px;
            border-radius: 15px;
        }

        #box {
            width: 300px;
            height: 150px;
            margin: 20px auto;
            background-color: lightblue;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 10px;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
            margin: 5px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>Change Background Color</h2>

        <div id="box">
            Click the button to change my color
        </div>

        <button onclick="changeColor()">
            Change Color
        </button>

        <button onclick="resetColor()">
            Reset Color
        </button>

        <br><br>

        <a href="../index.html">← Back to JavaScript Programs</a>
        <br><br>
        <a href="../../index.html">← Home</a>

    </div>

    <script>

        function changeColor() {

            document.getElementById("box").style.backgroundColor =
                "lightgreen";
        }

        function resetColor() {

            document.getElementById("box").style.backgroundColor =
                "lightblue";
        }

    </script>

</body>

</html>

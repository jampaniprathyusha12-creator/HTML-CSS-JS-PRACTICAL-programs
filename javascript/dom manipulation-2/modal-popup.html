<!DOCTYPE html>
<html>

<head>
    <title>Modal Popup</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 40px;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
        }

        .modal {
            display: none;
            position: fixed;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
        }

        .modal-content {
            background-color: white;
            width: 400px;
            margin: 150px auto;
            padding: 25px;
            border-radius: 10px;
        }

        .close {
            float: right;
            font-size: 25px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>Modal Popup</h1>

    <button onclick="openModal()">Open Modal</button>

    <div id="myModal" class="modal">

        <div class="modal-content">

            <span class="close" onclick="closeModal()">
                &times;
            </span>

            <h2>Welcome!</h2>

            <p>
                This is a modal popup created using JavaScript
                and DOM manipulation.
            </p>

            <button onclick="closeModal()">Close</button>

        </div>

    </div>

    <br><br>

    <a href="../index.html">← Back to JavaScript Programs</a>
    <br><br>
    <a href="../../index.html">← Home</a>

    <script>

        function openModal() {

            document.getElementById("myModal")
                .style.display = "block";
        }

        function closeModal() {

            document.getElementById("myModal")
                .style.display = "none";
        }

    </script>

</body>

</html>

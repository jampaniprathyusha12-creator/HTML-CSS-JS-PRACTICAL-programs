<!DOCTYPE html>
<html>

<head>
    <title>Create HTML Element Dynamically</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
            background-color: #f2f2f2;
        }

        .container {
            background-color: white;
            width: 500px;
            margin: auto;
            padding: 30px;
            border-radius: 15px;
        }

        #output {
            margin-top: 20px;
        }

        .item {
            background-color: lightblue;
            padding: 12px;
            margin: 10px;
            border-radius: 8px;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>Create Element Dynamically</h2>

        <p>Click the button to create a new paragraph.</p>

        <button onclick="createElementDynamically()">
            Create Element
        </button>

        <div id="output"></div>

        <br>

        <a href="../index.html">← Back to JavaScript Programs</a>
        <br><br>
        <a href="../../index.html">← Home</a>

    </div>

    <script>

        function createElementDynamically() {

            let newElement = document.createElement("p");

            newElement.textContent =
                "This paragraph was created dynamically using JavaScript.";

            newElement.className = "item";

            document.getElementById("output")
                .appendChild(newElement);
        }

    </script>

</body>

</html>

<!DOCTYPE html>
<html>

<head>
    <title>Shopping Cart using Local Storage</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            padding: 30px;
        }

        .container {
            width: 600px;
            margin: auto;
            background-color: white;
            padding: 25px;
            border-radius: 10px;
        }

        h2 {
            text-align: center;
        }

        .product {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            margin: 10px 0;
            background-color: #eee;
            border-radius: 5px;
        }

        button {
            padding: 8px 15px;
            cursor: pointer;
        }

        #cart {
            margin-top: 25px;
            padding: 15px;
            background-color: #f5f5f5;
        }

        #total {
            font-weight: bold;
            font-size: 18px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>Shopping Cart</h2>

        <div class="product">
            <span>Mobile Phone - ₹15000</span>
            <button onclick="addToCart('Mobile Phone', 15000)">
                Add to Cart
            </button>
        </div>

        <div class="product">
            <span>Headphones - ₹2000</span>
            <button onclick="addToCart('Headphones', 2000)">
                Add to Cart
            </button>
        </div>

        <div class="product">
            <span>Keyboard - ₹1200</span>
            <button onclick="addToCart('Keyboard', 1200)">
                Add to Cart
            </button>
        </div>

        <div class="product">
            <span>Mouse - ₹800</span>
            <button onclick="addToCart('Mouse', 800)">
                Add to Cart
            </button>
        </div>

        <div id="cart">
            <h3>Cart Items</h3>
            <div id="cartItems"></div>
            <p id="total">Total: ₹0</p>

            <button onclick="clearCart()">Clear Cart</button>
        </div>

        <br>

        <a href="../index.html">← Back to JavaScript Programs</a>
        <br><br>
        <a href="../../index.html">← Home</a>

    </div>

    <script>
        let cart = JSON.parse(localStorage.getItem("cart")) || [];

        function addToCart(name, price) {

            cart.push({
                name: name,
                price: price
            });

            localStorage.setItem("cart", JSON.stringify(cart));

            displayCart();
        }

        function displayCart() {

            let cartItems = document.getElementById("cartItems");
            let total = 0;

            cartItems.innerHTML = "";

            if (cart.length === 0) {
                cartItems.innerHTML = "Cart is empty.";
            }

            cart.forEach(function (item, index) {

                total += item.price;

                cartItems.innerHTML +=
                    "<p>" +
                    (index + 1) + ". " +
                    item.name +
                    " - ₹" + item.price +
                    "</p>";
            });

            document.getElementById("total").textContent =
                "Total: ₹" + total;
        }

        function clearCart() {

            cart = [];

            localStorage.removeItem("cart");

            displayCart();
        }

        displayCart();
    </script>

</body>

</html>
